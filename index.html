<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Health Tracker</title>
  <script crossorigin src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>
  <style>
    .chart-container { position: relative; height: 300px; width: 100%; }
    .card { 
      border-radius: 12px; 
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px 0 rgba(0, 0, 0, 0.03); 
    }
    .card-header { border-radius: 12px 12px 0 0; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen p-4">
  <div id="root"></div>

  <script>
    // Утилиты для генерации тестовых данных
    function randomBetween(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function getDateDaysAgo(daysAgo) {
      const date = new Date();
      date.setDate(date.getDate() - daysAgo);
      return date.toISOString().split('T')[0];
    }

    // Функции преобразования
    function sleepToText(value) {
      const texts = { '-2': 'Ужасно', '-1': 'Плохо', '0': 'Нормально', '1': 'Хорошо', '2': 'Отлично' };
      return texts[value.toString()] || 'Неизвестно';
    }

    function moodToText(value) {
      const texts = { '-2': 'Депрессия', '-1': 'Грустно', '0': 'Нейтрально', '1': 'Хорошо', '2': 'Отлично' };
      return texts[value.toString()] || 'Неизвестно';
    }

    function healthToText(value) {
      const texts = { '-2': 'Очень плохо', '-1': 'Плохо', '0': 'Нормально', '1': 'Хорошо', '2': 'Отлично' };
      return texts[value.toString()] || 'Неизвестно';
    }

    function activityToText(value) {
      const texts = { '0': 'Отдых', '1': 'Легкая', '2': 'Умеренная', '3': 'Интенсивная', '4': 'Максимальная' };
      return texts[value.toString()] || 'Неизвестно';
    }

    // Тестовые описания дней
    const dayDescriptions = [
      "хорошо выспался, позавтракал овсянкой с фруктами, пошел пешком на работу 2 км, выпил 2 кофе, на обед салат с курицей, вечером йога 30 минут, настроение отличное",
      "плохо спал всю ночь, болела голова, завтрак пропустил, выпил много кофе - 4 чашки, на обед только пельмени, после работы сразу домой, настроение паршивое",
      "проснулся бодрым, сделал зарядку, позавтракал яичницей с овощами, прошел пешком 3 км, выпил кофе утром, обедал борщом и салатом, вечером плавал в бассейне час, хорошее настроение",
      "спал нормально, завтрак - творог с ягодами, ехал на автобусе, 2 кофе за день, обед в кафе - паста с овощами, вечером встреча с друзьями, выпили пару бокалов вина, весело"
    ];

    function generateHealthEntry(daysAgo) {
      const originalText = dayDescriptions[randomBetween(0, dayDescriptions.length - 1)];
      const lowerText = originalText.toLowerCase();
      
      let sleep = 0;
      if (lowerText.includes('плохо спал') || lowerText.includes('бессонная')) sleep = -1;
      if (lowerText.includes('хорошо спал') || lowerText.includes('выспался')) sleep = 1;
      
      let mood = 0;
      if (lowerText.includes('паршивое') || lowerText.includes('грустное')) mood = -1;
      if (lowerText.includes('отличное') || lowerText.includes('весело')) mood = 1;
      
      let health = 0;
      if (lowerText.includes('болела голова')) health = -1;
      if (lowerText.includes('бодрым') || lowerText.includes('энергии')) health = 1;
      
      let activity = 1;
      if (lowerText.includes('плавал') || lowerText.includes('пешком')) activity = 2;
      if (lowerText.includes('йога') || lowerText.includes('зарядку')) activity = 3;
      
      let coffee = 1;
      if (lowerText.includes('много кофе') || lowerText.includes('4 чашки')) coffee = 4;
      else if (lowerText.includes('2 кофе')) coffee = 2;
      
      let alco = 0;
      if (lowerText.includes('вино') || lowerText.includes('бокал')) alco = randomBetween(1, 2);
      
      let vege = 30;
      if (lowerText.includes('салат') || lowerText.includes('овощ')) vege += 30;
      vege = Math.max(10, Math.min(100, vege));
      
      const calMin = 1600 + randomBetween(0, 400);
      const calMax = calMin + randomBetween(200, 600);
      
      const summary = sleep === -1 ? 'плохо спал' : sleep === 1 ? 'хорошо спал' : 'обычный день';
      
      return {
        date: getDateDaysAgo(daysAgo),
        sleep, mood, health, activity,
        calMin, calMax, vege, coffee, alco,
        summary, original: originalText
      };
    }

    function generateTestData(days) {
      const entries = [];
      for (let i = 1; i <= days; i++) {
        entries.push(generateHealthEntry(i));
      }
      return entries.sort((a, b) => new Date(b.date) - new Date(a.date));
    }

    // Глобальные переменные для доступа из React
    window.generateTestData = generateTestData;
    window.generateHealthEntry = generateHealthEntry;
    window.sleepToText = sleepToText;
    window.moodToText = moodToText;
    window.healthToText = healthToText;
    window.activityToText = activityToText;
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function HealthTracker() {
      // Основные настройки
      const user = { weight: 75, height: 175, age: 28, name: 'Тестовый пользователь' };
      const bmr = 88.362 + 13.397 * user.weight + 4.799 * user.height - 5.677 * user.age;
      const calorieNorm = Math.round(bmr * 1.375);

      // Состояния
      const [text, setText] = useState('');
      const [loading, setLoading] = useState(false);
      const [entries, setEntries] = useState([]);
      const [weeklySummary, setWeeklySummary] = useState(null);
      const [weeklyAdvice, setWeeklyAdvice] = useState('');
      const [showTestDataButton, setShowTestDataButton] = useState(true);
      const [calorieGoal, setCalorieGoal] = useState('maintain');
      const [selectedDate, setSelectedDate] = useState('');
      const [editingEntry, setEditingEntry] = useState(null);
      const [isEditing, setIsEditing] = useState(false);
      const [showDataPanel, setShowDataPanel] = useState(false);

      // Refs для графиков
      const refHealth = useRef();
      const refActivity = useRef();
      const refCalories = useRef();

      // Загрузка данных при старте
      useEffect(() => {
        const savedEntries = localStorage.getItem('healthEntries');
        if (savedEntries) {
          try {
            setEntries(JSON.parse(savedEntries));
            setShowTestDataButton(false);
          } catch (e) {
            console.error('Ошибка загрузки данных:', e);
          }
        }
      }, []);

      // Обновление при изменении записей
      useEffect(() => {
        if (entries.length > 0) {
          localStorage.setItem('healthEntries', JSON.stringify(entries));
          updateWeekly();
        }
      }, [entries]);

      // Функции для работы с данными
      const loadTestData = () => {
        const testData = window.generateTestData(14);
        setEntries(testData);
        setShowTestDataButton(false);
      };

      const clearAllData = () => {
        if (confirm('Удалить все данные?')) {
          setEntries([]);
          localStorage.removeItem('healthEntries');
          setShowTestDataButton(true);
          setWeeklySummary(null);
          setWeeklyAdvice('');
        }
      };

      const addRandomEntry = () => {
        const today = new Date().toISOString().split('T')[0];
        const existing = entries.find(e => e.date === today);
        
        if (existing && !confirm('Запись за сегодня уже есть. Заменить?')) {
          return;
        }
        
        const randomEntry = window.generateHealthEntry(0);
        setEntries(prev => {
          const filtered = prev.filter(e => e.date !== today);
          return [randomEntry, ...filtered].sort((a, b) => new Date(b.date) - new Date(a.date));
        });
      };

      // Генерация последних 7 дней для календаря
      const getLast7Days = () => {
        const days = [];
        for (let i = 6; i >= 0; i--) {
          const date = new Date();
          date.setDate(date.getDate() - i);
          const dateStr = date.toISOString().split('T')[0];
          const dayName = date.toLocaleDateString('ru-RU', { weekday: 'short' });
          const dayNum = date.getDate();
          const hasEntry = entries.some(entry => entry.date === dateStr);
          
          days.push({
            date: dateStr,
            dayName,
            dayNum,
            hasEntry,
            isToday: i === 0,
            isFuture: i < 0
          });
        }
        return days;
      };

      // Обработка выбора даты
      const handleDateSelect = (dateStr) => {
        const existingEntry = entries.find(entry => entry.date === dateStr);
        
        if (existingEntry) {
          setSelectedDate(dateStr);
          setEditingEntry(existingEntry);
          setText(existingEntry.original || '');
          setIsEditing(true);
        } else {
          setSelectedDate(dateStr);
          setEditingEntry(null);
          setText('');
          setIsEditing(false);
        }
      };

      // Отмена редактирования
      const handleCancelEdit = () => {
        setSelectedDate('');
        setEditingEntry(null);
        setText('');
        setIsEditing(false);
      };

      // API запрос к анализатору
      const analyzeWithProxy = async (dayText) => {
        const res = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: dayText })
        });
        
        if (!res.ok) throw new Error('API Error: ' + res.status);
        return res.json();
      };

      // Анализ дня
      const handleAnalyze = async () => {
        if (!text.trim()) {
          alert('Опишите день.');
          return;
        }

        if (!selectedDate) {
          alert('Выберите дату для записи.');
          return;
        }
        
        setLoading(true);
        try {
          const metrics = await analyzeWithProxy(text);
          
          if (isEditing) {
            setEntries(prev => 
              prev.map(entry => 
                entry.date === selectedDate 
                  ? { ...entry, ...metrics, original: text }
                  : entry
              ).sort((a, b) => new Date(b.date) - new Date(a.date))
            );
          } else {
            setEntries(prev => {
              const filtered = prev.filter(e => e.date !== selectedDate);
              return [{ date: selectedDate, ...metrics }, ...filtered]
                .sort((a, b) => new Date(b.date) - new Date(a.date));
            });
          }
          
          handleCancelEdit();
          
        } catch(err) {
          console.error(err);
          alert('Ошибка анализа: ' + err.message);
        } finally {
          setLoading(false);
        }
      };

      // Обновление еженедельной сводки
      const updateWeekly = () => {
        const last7 = entries.slice(0, 7);
        if (last7.length < 1) return;
        
        const sum = last7.reduce((a, e) => {
          a.sleep += e.sleep; a.mood += e.mood; a.health += e.health;
          a.activity += e.activity; a.vege += e.vege;
          a.coffee += e.coffee; a.alco += e.alco;
          return a;
        }, { sleep: 0, mood: 0, health: 0, activity: 0, vege: 0, coffee: 0, alco: 0 });
        
        const n = last7.length;
        
        setWeeklySummary({
          days: n,
          sleep: sum.sleep / n,
          mood: sum.mood / n,
          health: sum.health / n,
          activity: sum.activity / n,
          vege: Math.round(sum.vege / n),
          coffee: sum.coffee / n,
          alco: sum.alco / n
        });
        
        let advice = '';
        if (sum.sleep / n < -0.5) advice += 'Стоит улучшить качество сна. ';
        if (sum.mood / n < 0) advice += 'Попробуйте больше активностей для настроения. ';
        if (sum.activity / n < 1.5) advice += 'Добавьте физической активности. ';
        if (sum.vege / n < 40) advice += 'Включите больше овощей в рацион. ';
        if (sum.coffee / n > 3) advice += 'Возможно, стоит ограничить кофе. ';
        if (!advice) advice = 'Отличные показатели! Продолжайте в том же духе! 🎉';
        
        setWeeklyAdvice(advice);
      };

      // Определение цвета метрики
      const getMetricColor = (value, type) => {
        if (type === 'sleep' || type === 'mood' || type === 'health') {
          if (value >= 1) return 'text-emerald-600 bg-emerald-50 border-emerald-200';
          if (value >= 0) return 'text-amber-600 bg-amber-50 border-amber-200';
          return 'text-rose-600 bg-rose-50 border-rose-200';
        }
        if (type === 'activity') {
          if (value >= 2.5) return 'text-emerald-600 bg-emerald-50 border-emerald-200';
          if (value >= 1.5) return 'text-amber-600 bg-amber-50 border-amber-200';
          return 'text-rose-600 bg-rose-50 border-rose-200';
        }
        if (type === 'vege') {
          if (value >= 50) return 'text-emerald-600 bg-emerald-50 border-emerald-200';
          if (value >= 30) return 'text-amber-600 bg-amber-50 border-amber-200';
          return 'text-rose-600 bg-rose-50 border-rose-200';
        }
        if (type === 'coffee') {
          if (value <= 2) return 'text-emerald-600 bg-emerald-50 border-emerald-200';
          if (value <= 3) return 'text-amber-600 bg-amber-50 border-amber-200';
          return 'text-rose-600 bg-rose-50 border-rose-200';
        }
        return 'text-slate-600 bg-slate-50 border-slate-200';
      };

      // Текстовое представление метрики
      const getMetricText = (value, type) => {
        if (type === 'sleep') return window.sleepToText(Math.round(value));
        if (type === 'mood') return window.moodToText(Math.round(value));
        if (type === 'health') return window.healthToText(Math.round(value));
        if (type === 'activity') return window.activityToText(Math.round(value));
        return value.toString();
      };

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          {/* Заголовок */}
          <header className="bg-white card">
            <div className="p-6">
              <h1 className="text-2xl font-bold text-slate-800">🧠 AI Health Tracker</h1>
              <p className="text-slate-600 mt-1">
                {user.name}, {user.height} см, {user.weight} кг — норма {calorieNorm} ккал/день
              </p>
              <p className="text-sm text-blue-600 mt-2">
                📊 Записей в системе: {entries.length}
              </p>
            </div>
          </header>

          {/* Панель управления данными */}
          <section className="bg-white card overflow-hidden">
            <button
              onClick={() => setShowDataPanel(!showDataPanel)}
              className="w-full px-6 py-4 bg-gradient-to-r from-slate-50 to-blue-50 border-b border-slate-100 text-left hover:from-slate-100 hover:to-blue-100 transition-colors"
            >
              <div className="flex items-center justify-between">
                <h3 className="font-semibold text-slate-700">🎲 Управление данными</h3>
                <span className={`text-slate-500 transition-transform ${showDataPanel ? 'rotate-180' : ''}`}>
                  ▼
                </span>
              </div>
            </button>
            
            {showDataPanel && (
              <div className="p-6 border-t border-slate-100">
                <div className="flex flex-wrap gap-3">
                  {showTestDataButton && (
                    <button
                      onClick={loadTestData}
                      className="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors"
                    >
                      📊 Загрузить тестовые данные (14 дней)
                    </button>
                  )}
                  <button
                    onClick={addRandomEntry}
                    className="px-4 py-2 bg-emerald-500 text-white rounded-lg hover:bg-emerald-600 transition-colors"
                  >
                    🎯 Добавить случайную запись за сегодня
                  </button>
                  <button
                    onClick={clearAllData}
                    className="px-4 py-2 bg-rose-500 text-white rounded-lg hover:bg-rose-600 transition-colors"
                  >
                    🗑️ Очистить все данные
                  </button>
                </div>
                <p className="text-sm text-slate-500 mt-3">
                  💡 Тестовые данные помогают проверить графики и аналитику без ручного ввода
                </p>
              </div>
            )}
          </section>

          {/* Сводка */}
          {weeklySummary && (
            <section className="bg-white card overflow-hidden">
              <div className="card-header bg-gradient-to-r from-blue-500 to-indigo-500 px-6 py-4">
                <h3 className="text-xl font-bold text-white flex items-center">
                  📊 Сводка за {weeklySummary.days} дней
                  <span className="ml-auto text-blue-100 text-sm">
                    {new Date().toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' })}
                  </span>
                </h3>
              </div>
              
              <div className="p-6">
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                  <div className={`p-4 rounded-xl border transition-all hover:shadow-sm ${getMetricColor(weeklySummary.sleep, 'sleep')}`}>
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-2xl">😴</span>
                      <span className="text-xs font-medium opacity-75">СОН</span>
                    </div>
                    <div className="font-bold text-lg">{getMetricText(weeklySummary.sleep, 'sleep')}</div>
                    <div className="text-xs opacity-75 mt-1">{weeklySummary.sleep.toFixed(1)} балла</div>
                  </div>

                  <div className={`p-4 rounded-xl border transition-all hover:shadow-sm ${getMetricColor(weeklySummary.mood, 'mood')}`}>
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-2xl">😊</span>
                      <span className="text-xs font-medium opacity-75">НАСТРОЕНИЕ</span>
                    </div>
                    <div className="font-bold text-lg">{getMetricText(weeklySummary.mood, 'mood')}</div>
                    <div className="text-xs opacity-75 mt-1">{weeklySummary.mood.toFixed(1)} балла</div>
                  </div>

                  <div className={`p-4 rounded-xl border transition-all hover:shadow-sm ${getMetricColor(weeklySummary.health, 'health')}`}>
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-2xl">❤️</span>
                      <span className="text-xs font-medium opacity-75">ЗДОРОВЬЕ</span>
                    </div>
                    <div className="font-bold text-lg">{getMetricText(weeklySummary.health, 'health')}</div>
                    <div className="text-xs opacity-75 mt-1">{weeklySummary.health.toFixed(1)} балла</div>
                  </div>

                  <div className={`p-4 rounded-xl border transition-all hover:shadow-sm ${getMetricColor(weeklySummary.activity, 'activity')}`}>
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-2xl">🏃</span>
                      <span className="text-xs font-medium opacity-75">АКТИВНОСТЬ</span>
                    </div>
                    <div className="font-bold text-lg">{getMetricText(weeklySummary.activity, 'activity')}</div>
                    <div className="text-xs opacity-75 mt-1">{weeklySummary.activity.toFixed(1)} балла</div>
                  </div>
                </div>

                <div className="bg-gradient-to-r from-blue-50 to-indigo-50 p-4 rounded-xl border border-blue-100">
                  <div className="flex items-start space-x-3">
                    <span className="text-2xl">💡</span>
                    <div>
                      <h4 className="font-semibold text-blue-800 mb-1">Персональные рекомендации</h4>
                      <p className="text-blue-700 text-sm leading-relaxed">{weeklyAdvice}</p>
                    </div>
                  </div>
                </div>
              </div>
            </section>
          )}

          {/* Форма добавления записи */}
          <section className="bg-white card overflow-hidden">
            <div className="card-header bg-gradient-to-r from-emerald-500 to-teal-500 px-6 py-4">
              <h3 className="text-xl font-bold text-white">✍️ Добавить новую запись</h3>
            </div>
            
            <div className="p-6">
              <div className="mb-6">
                <h4 className="text-sm font-medium text-slate-700 mb-3">Выберите день для записи:</h4>
                <div className="grid grid-cols-7 gap-2">
                  {getLast7Days().map((day) => (
                    <button
                      key={day.date}
                      onClick={() => handleDateSelect(day.date)}
                      disabled={day.isFuture}
                      className={`p-3 rounded-xl border transition-all text-sm font-medium ${
                        selectedDate === day.date
                          ? 'border-blue-300 bg-blue-50 text-blue-700'
                          : day.hasEntry
                          ? 'border-emerald-200 bg-emerald-50 text-emerald-700 hover:border-emerald-300'
                          : day.isFuture
                          ? 'border-slate-200 bg-slate-100 text-slate-400 cursor-not-allowed'
                          : 'border-slate-200 bg-white text-slate-700 hover:border-slate-300'
                      }`}
                    >
                      <div className="text-xs">{day.dayName}</div>
                      <div className="font-bold">{day.dayNum}</div>
                      <div className="text-xs mt-1">
                        {selectedDate === day.date ? (
                          <span className="text-blue-600">✏️ Выбран</span>
                        ) : day.hasEntry ? (
                          <span className="text-emerald-600">✅ Есть</span>
                        ) : day.isFuture ? (
                          <span className="text-slate-400">⏳ Ждем</span>
                        ) : (
                          <span className="text-orange-600">⭕ Пусто</span>
                        )}
                      </div>
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid lg:grid-cols-2 gap-6">
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-2">
                    {isEditing ? 'Редактировать запись:' : 'Описание дня:'}
                  </label>
                  <textarea
                    className="w-full border border-slate-200 rounded-xl p-3 text-sm resize-none focus:ring-2 focus:ring-blue-300 focus:border-blue-300 transition-colors"
                    rows={10}
                    placeholder={
                      selectedDate 
                        ? `Опишите день ${new Date(selectedDate).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' })}...`
                        : "Сначала выберите день выше..."
                    }
                    value={text}
                    onChange={e => setText(e.target.value)}
                    disabled={loading || !selectedDate}
                  />
                  
                  <div className="flex gap-3 mt-4">
                    <button
                      onClick={handleAnalyze}
                      disabled={loading || !text.trim() || !selectedDate}
                      className="flex-1 px-4 py-2 bg-blue-500 text-white rounded-xl disabled:bg-slate-300 font-medium transition-colors hover:bg-blue-600"
                    >
                      {loading ? 'Анализирую…' : isEditing ? '🤖 Обновить запись' : '🤖 Создать запись'}
                    </button>
                    
                    {isEditing && (
                      <button
                        onClick={handleCancelEdit}
                        className="px-4 py-2 bg-slate-400 text-white rounded-xl font-medium transition-colors hover:bg-slate-500"
                      >
                        Отмена
                      </button>
                    )}
                  </div>
                </div>

                <div className="bg-slate-50 rounded-xl p-4">
                  <h5 className="font-medium text-slate-800 mb-3">💡 Что описать в записи:</h5>
                  <div className="space-y-3 text-sm text-slate-600">
                    <div>
                      <strong className="text-slate-800">😴 Сон:</strong>
                      <p>Как спали? Сколько часов? Качество сна?</p>
                    </div>
                    <div>
                      <strong className="text-slate-800">🍽️ Питание:</strong>
                      <p>Завтрак, обед, ужин. Перекусы, овощи, фрукты.</p>
                    </div>
                    <div>
                      <strong className="text-slate-800">☕ Напитки:</strong>
                      <p>Сколько кофе? Чай? Алкоголь? Вода?</p>
                    </div>
                    <div>
                      <strong className="text-slate-800">😊 Настроение:</strong>
                      <p>Как себя чувствовали эмоционально?</p>
                    </div>
                    <div>
                      <strong className="text-slate-800">🏃 Активность:</strong>
                      <p>Спорт, прогулки, физический труд, зал?</p>
                    </div>
                    <div>
                      <strong className="text-slate-800">❤️ Самочувствие:</strong>
                      <p>Здоровье, энергия, болезни, усталость?</p>
                    </div>
                  </div>
                  
                  <div className="mt-4 p-3 bg-blue-50 rounded-lg border border-blue-100">
                    <p className="text-xs text-blue-700">
                      <strong>Совет:</strong> Чем подробнее опишете день, тем точнее будет анализ ИИ!
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* История записей */}
          <section className="bg-white card">
            <div className="p-6">
              <h3 className="font-semibold mb-4 text-slate-800">📚 История записей</h3>
              {entries.length === 0 ? (
                <div className="text-center py-12">
                  <p className="text-slate-500 italic text-lg">📝 Пока нет записей</p>
                  <p className="text-slate-400 mt-2">Загрузите тестовые данные или добавьте первую запись!</p>
                </div>
              ) : (
                <div className="space-y-4">
                  {entries.slice(0, 10).map((e, i) => (
                    <div key={i} className="border border-slate-200 p-4 rounded-xl hover:shadow-sm transition-all bg-slate-50">
                      <div className="flex justify-between items-center mb-3">
                        <span className="font-medium text-lg text-slate-800">
                          {new Date(e.date).toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' })}
                        </span>
                        <div className="flex space-x-1 text-xl">
                          {Array(Math.min(e.coffee || 0, 5)).fill().map((_, j) => <span key={j}>☕</span>)}
                          {Array(Math.min(e.alco || 0, 5)).fill().map((_, j) => <span key={j}>🍺</span>)}
                        </div>
                      </div>
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm mb-3">
                        <div className="flex items-center">
                          <span className="mr-2">😴</span>
                          <span className="text-slate-700">Сон: {window.sleepToText(e.sleep)}</span>
                        </div>
                        <div className="flex items-center">
                          <span className="mr-2">😊</span>
                          <span className="text-slate-700">Настроение: {window.moodToText(e.mood)}</span>
                        </div>
                        <div className="flex items-center">
                          <span className="mr-2">❤️</span>
                          <span className="text-slate-700">Здоровье: {window.healthToText(e.health)}</span>
                        </div>
                        <div className="flex items-center">
                          <span className="mr-2">{['💤','🚶','🏃','🏋️','🔥'][e.activity] || '❓'}</span>
                          <span className="text-slate-700">Активность: {window.activityToText(e.activity)}</span>
                        </div>
                      </div>
                      <div className="mb-3">
                        <span className="text-sm text-slate-500">🍽️ Калории: </span>
                        <span className="font-medium text-slate-700">{e.calMin}–{e.calMax} ккал</span>
                        <span className="text-sm text-slate-500 ml-4">🥗 Овощи: </span>
                        <span className={`font-medium ${e.vege >= 50 ? 'text-emerald-600' : e.vege >= 30 ? 'text-amber-600' : 'text-rose-600'}`}>
                          {e.vege}%
                        </span>
                      </div>
                      <p className="italic text-slate-600 bg-white p-3 rounded-lg border border-slate-100">"{e.summary}"</p>
                    </div>
                  ))}
                  {entries.length > 10 && (
                    <p className="text-center text-slate-500 italic mt-6">
                      И еще {entries.length - 10} записей...
                    </p>
                  )}
                </div>
              )}
            </div>
          </section>
        </div>
      );
    }

    ReactDOM.render(<HealthTracker />, document.getElementById('root'));
  </script>
</body>
</html>
