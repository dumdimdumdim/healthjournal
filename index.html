<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Health Tracker</title>
  <!-- React 17 и ReactDOM 17 -->
  <script crossorigin src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
  <!-- Babel для JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- TailwindCSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Plotly.js -->
  <script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>
  <style>
    .chart-container { position: relative; height: 300px; width: 100%; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen p-4">
  <div id="root"></div>

  <script type="text/babel">
  const { useState, useEffect, useRef } = React;

  function HealthTracker() {
    // Жёстко закодированный профиль
    const user = { weight:98, height:178, age:30, name:'Пользователь' };
    const bmr = 88.362 + 13.397 * user.weight + 4.799 * user.height - 5.677 * user.age;
    const calorieNorm = Math.round(bmr * 1.55);

    // Состояния
    const [text, setText] = useState('');
    const [loading, setLoading] = useState(false);
    const [entries, setEntries] = useState([]);
    const [weeklySummary, setWeeklySummary] = useState('');
    const [weeklyAdvice, setWeeklyAdvice] = useState('');
    const [errorMessage, setErrorMessage] = useState('');

    // Рефы для холстов
    const refHealth = useRef();
    const refActivity = useRef();
    const refCalories = useRef();

    // Хэлпер для вызова нашей serverless-функции
    async function analyzeWithProxy(dayText) {
      console.log('Sending request to /api/analyze with text:', dayText);
      
      const res = await fetch('/api/analyze', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body:JSON.stringify({ text: dayText })
      });
      
      console.log('Response status:', res.status);
      console.log('Response ok:', res.ok);
      
      if (!res.ok) {
        const errorText = await res.text();
        console.error('API Error:', res.status, errorText);
        throw new Error(`API Error: ${res.status} - ${errorText}`);
      }
      
      const result = await res.json();
      console.log('API Result:', result);
      return result;
    }

    // При добавлении новой записи — обновляем списки и графики
    useEffect(()=>{
      if (!entries.length) return;
      drawHealth();
      drawActivity();
      drawCalories();
      updateWeekly();
    }, [entries]);

    // Добавить сегодня
    const handleAnalyze = async () => {
      if (!text.trim()) {
        setErrorMessage('Пожалуйста, опишите свой день');
        return;
      }
      
      setLoading(true);
      setErrorMessage('');
      
      try {
        const today = new Date().toISOString().split('T')[0];
        console.log('Analyzing text for date:', today);
        
        const metrics = await analyzeWithProxy(text);
        console.log('Received metrics:', metrics);
        
        setEntries(prev=>[...prev, { date: today, ...metrics }]);
        setText('');
        setErrorMessage('');
        
      } catch(err) {
        console.error('Analysis error:', err);
        setErrorMessage(`Ошибка анализа: ${err.message}`);
        
        // Добавляем запись с дефолтными значениями
        const today = new Date().toISOString().split('T')[0];
        const defaultMetrics = {
          sleep: 0, mood: 0, health: 0, activity: 1,
          calMin: 1800, calMax: 2200, vege: 30,
          coffee: 1, alco: 0,
          summary: "Ошибка анализа - использованы стандартные значения",
          original: text
        };
        
        setEntries(prev=>[...prev, { date: today, ...defaultMetrics }]);
        setText('');
        
      } finally {
        setLoading(false);
      }
    };

    // Функция для тестирования API
    const testAPI = async () => {
      setLoading(true);
      setErrorMessage('');
      
      try {
        console.log('Testing API...');
        const testResult = await analyzeWithProxy('Тестовый запрос: хорошо спал, ел овощи, пил кофе');
        console.log('Test successful:', testResult);
        setErrorMessage('✅ API работает! Результат теста: ' + JSON.stringify(testResult));
      } catch (err) {
        console.error('API test failed:', err);
        setErrorMessage('❌ Тест API не прошел: ' + err.message);
      } finally {
        setLoading(false);
      }
    };

    // Рисуем самочувствие
    function drawHealth(){
      const ctx = refHealth.current?.getContext('2d');
      if (!ctx) return;
      
      if (window.chartHealth) window.chartHealth.destroy();
      window.chartHealth = new Chart(ctx, {
        type:'line',
        data:{
          labels: entries.map(e=>e.date.slice(5).replace('-','.')),
          datasets:[
            { label:'Сон', data:entries.map(e=>e.sleep), borderColor:'#3b82f6', fill:false, tension:0.3 },
            { label:'Настроение', data:entries.map(e=>e.mood), borderColor:'#22c55e', fill:false, tension:0.3 },
            { label:'Здоровье', data:entries.map(e=>e.health), borderColor:'#a855f7', fill:false, tension:0.3 }
          ]
        },
        options:{ responsive:true, maintainAspectRatio:false,
          scales:{ y:{ min:-2, max:2, ticks:{ stepSize:1 } } }
        }
      });
    }

    // Рисуем активность
    function drawActivity(){
      const ctx = refActivity.current?.getContext('2d');
      if (!ctx) return;
      
      if (window.chartAct) window.chartAct.destroy();
      window.chartAct = new Chart(ctx, {
        type:'bar',
        data:{
          labels: entries.map(e=>e.date.slice(5).replace('-','.')),
          datasets:[{
            label:'Активность',
            data: entries.map(e=>e.activity),
            backgroundColor: entries.map(e=>
              e.activity===0?'#9ca3af':
              e.activity===1?'#22c55e':
              e.activity===2?'#3b82f6':
              e.activity===3?'#f59e0b':'#ef4444'
            )
          }]
        },
        options:{ responsive:true, maintainAspectRatio:false,
          scales:{ y:{ min:0, max:4, ticks:{ stepSize:1 } } }
        }
      });
    }

    // Рисуем питание/калории
    function drawCalories(){
      if (!refCalories.current) return;
      
      const dates = entries.map(e=>e.date.slice(5).replace('-','.'));
      const centers = entries.map(e=>(e.calMin+e.calMax)/2);
      const errUp = entries.map(e=>e.calMax - (e.calMin+e.calMax)/2);
      const errDn = entries.map(e=> (e.calMin+e.calMax)/2 - e.calMin);
      const colors = entries.map(e=> e.vege>=50?'#22c55e': e.vege>=30?'#f59e0b':'#ef4444');
      const normMin = calorieNorm * 0.85, normMax = calorieNorm * 1.15;
      const shape = [{
        type:'rect', xref:'paper', yref:'y',
        x0:0, x1:1, y0:normMin, y1:normMax,
        fillcolor:'rgba(220,255,220,0.3)', line:{width:0}
      }];

      const trace = {
        x: dates, y: centers, mode:'markers',
        marker:{ color:colors, size:12 },
        error_y:{ type:'data', array:errUp, arrayminus:errDn, thickness:2, width:6 },
        customdata: entries.map(e=>[e.vege,e.coffee,e.alco]),
        hovertemplate:
          `<b>%{x}</b><br>`+
          `Калории: %{y-error_y.arrayminus:.0f}–%{y+error_y.array:.0f} ккал<br>`+
          `Овощи: %{customdata[0]}%<br>`+
          `☕ %{customdata[1]}  🍺 %{customdata[2]}<extra></extra>`
      };

      const layout = {
        title:{ text:'🍎 Питание и калории' },
        shapes: shape,
        xaxis:{ title:'День' },
        yaxis:{ title:'ккал' },
        margin:{ t:40, b:60, l:60, r:20 },
        showlegend:false
      };

      Plotly.react(refCalories.current, [trace], layout, {displayModeBar:false, responsive:true});
    }

    // Еженедельное резюме и совет
    function updateWeekly(){
      const last7 = entries.slice(-7);
      if (last7.length<1) return;
      const sum = last7.reduce((a,e)=>{
        a.sleep += e.sleep; a.mood += e.mood; a.health += e.health;
        a.activity += e.activity; a.vege += e.vege;
        a.coffee += e.coffee; a.alco += e.alco;
        return a;
      },{sleep:0,mood:0,health:0,activity:0,vege:0,coffee:0,alco:0});
      const n = last7.length;
      setWeeklySummary(
        `Итоги недели: сон ${(sum.sleep/n).toFixed(1)}, `+
        `настроение ${(sum.mood/n).toFixed(1)}, `+
        `здоровье ${(sum.health/n).toFixed(1)}, `+
        `активность ${(sum.activity/n).toFixed(1)}, `+
        `овощи ${Math.round(sum.vege/n)}%, `+
        `☕ ${(sum.coffee/n).toFixed(1)}, 🍺 ${(sum.alco/n).toFixed(1)}`
      );
      setWeeklyAdvice('Продолжайте в том же духе, добавьте больше овощей.');
    }

    return (
      <div className="max-w-4xl mx-auto space-y-6">
        <header className="bg-white p-4 rounded shadow">
          <h1 className="text-2xl font-bold">🧠 AI Health Tracker</h1>
          <p className="text-gray-600">
            {user.name}, {user.height} см, {user.weight} кг — норма {calorieNorm} ккал/день
          </p>
        </header>

        {/* Панель отладки */}
        <section className="bg-yellow-50 border border-yellow-200 p-4 rounded">
          <h3 className="font-semibold mb-2">🔧 Отладка API</h3>
          <button
            onClick={testAPI}
            disabled={loading}
            className="px-4 py-2 bg-yellow-600 text-white rounded disabled:bg-gray-400 mr-2"
          >
            {loading ? 'Тестирую...' : 'Тест API'}
          </button>
          {errorMessage && (
            <div className={`mt-2 p-2 rounded ${
              errorMessage.includes('✅') ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'
            }`}>
              {errorMessage}
            </div>
          )}
        </section>

        {!!weeklySummary && (
          <section className="bg-white p-4 rounded shadow">
            <p className="font-medium">{weeklySummary}</p>
            <p className="mt-2 text-blue-700 bg-blue-50 p-2 rounded">{weeklyAdvice}</p>
          </section>
        )}

        <section className="bg-white p-4 rounded shadow">
          <textarea
            className="w-full border p-2 rounded mb-2"
            rows={4}
            placeholder="Опишите свой день: как спали, что ели, какая была активность, настроение..."
            value={text}
            onChange={e=>setText(e.target.value)}
            disabled={loading}
          />
          <button
            onClick={handleAnalyze}
            disabled={loading || !text.trim()}
            className="px-4 py-2 bg-blue-600 text-white rounded disabled:bg-gray-400"
          >
            {loading ? 'Анализирую…' : 'Анализировать день'}
          </button>
        </section>

        {entries.length > 0 && (
          <>
            <div className="grid lg:grid-cols-2 gap-6">
              <div className="bg-white p-4 rounded shadow">
                <h3 className="font-semibold mb-2">📈 Самочувствие</h3>
                <div className="chart-container"><canvas ref={refHealth}></canvas></div>
              </div>
              <div className="bg-white p-4 rounded shadow">
                <h3 className="font-semibold mb-2">🏃 Активность</h3>
                <div className="chart-container"><canvas ref={refActivity}></canvas></div>
              </div>
            </div>

            <div className="bg-white p-4 rounded shadow">
              <h3 className="font-semibold mb-2">🍎 Питание и калории</h3>
              <div ref={refCalories} className="chart-container"></div>
            </div>
          </>
        )}

        <section className="bg-white p-4 rounded shadow">
          <h3 className="font-semibold mb-3">📚 История последних 7 дней</h3>
          {entries.length === 0 ? (
            <p className="text-gray-500 italic">Пока нет записей. Добавьте первую запись выше!</p>
          ) : (
            <div className="space-y-4">
              {entries.slice(-7).reverse().map((e,i)=>(
                <div key={i} className="border p-3 rounded">
                  <div className="flex justify-between items-center">
                    <span className="font-medium">
                      {new Date(e.date).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}
                    </span>
                    <div className="flex space-x-1 text-xl">
                      {[...Array(Math.min(e.coffee || 0, 5))].map((_,j)=><span key={j}>☕</span>)}
                      {[...Array(Math.min(e.alco || 0, 5))].map((_,j)=><span key={j}>🍺</span>)}
                    </div>
                  </div>
                  <div className="grid grid-cols-2 md:grid-cols-5 gap-2 text-sm mt-2">
                    <div>Сон: {e.sleep>0?'+':''}{e.sleep}</div>
                    <div>Настроение: {e.mood>0?'+':''}{e.mood}</div>
                    <div>Здоровье: {e.health>0?'+':''}{e.health}</div>
                    <div>Активность: {['💤','🚶','🏃','🏋️','🔥'][e.activity] || '❓'}</div>
                    <div>Калории: {e.calMin}–{e.calMax}</div>
                  </div>
                  <p className="italic mt-2 text-gray-600">"{e.summary}"</p>
                  <p className="mt-1 text-gray-500 text-xs">{e.original}</p>
                </div>
              ))}
            </div>
          )}
        </section>
      </div>
    );
  }

  ReactDOM.render(<HealthTracker />, document.getElementById('root'));
  </script>
</body>
</html>
