<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Health Tracker</title>
    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>
    <style>
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function HealthTracker() {
        // Профиль пользователя
        const userProfile = { weight: 98, height: 178, gender: 'male', age: 30, name: 'Пользователь' };
        const bmr = 88.362 + 13.397 * userProfile.weight + 4.799 * userProfile.height - 5.677 * userProfile.age;
        const calorieNorm = Math.round(bmr * 1.55);

        const [dayText, setDayText] = useState('');
        const [isAnalyzing, setIsAnalyzing] = useState(false);
        const [healthData, setHealthData] = useState([]);
        const [summary, setSummary] = useState('');
        const [advice, setAdvice] = useState('');

        const healthChartRef = useRef();
        const activityChartRef = useRef();
        const nutritionRef = useRef();

        // Генерация мок-данных при старт
        useEffect(() => {
            const data = [];
            const today = new Date();
            for (let i = 6; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(d.getDate() - i);
                data.push({
                    date: d.toISOString().split('T')[0],
                    sleep_quality: Math.floor(Math.random()*5)-2,
                    mood: Math.floor(Math.random()*5)-2,
                    health_status: Math.floor(Math.random()*5)-2,
                    physical_activity: Math.floor(Math.random()*5),
                    calories_min: calorieNorm - 300 + Math.random()*200,
                    calories_max: calorieNorm + 200 + Math.random()*400,
                    vegetables_percent: Math.random()*100,
                    coffee_cups: Math.floor(Math.random()*4),
                    alcohol_units: Math.random()<0.3?Math.floor(Math.random()*3):0,
                    summary: 'Тестовый день',
                });
            }
            setHealthData(data);
        }, []);

        // Перерисовка графиков при обновлении данных
        useEffect(() => {
            if (!healthData.length) return;
            drawHealth(); drawActivity(); drawNutrition();
        }, [healthData]);

        function drawHealth() {
            const ctx = healthChartRef.current.getContext('2d');
            if (window.healthChart) window.healthChart.destroy();
            window.healthChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: healthData.map(d=>d.date.split('-').slice(1).join('-')),
                    datasets: [
                        {label:'Сон', data:healthData.map(d=>d.sleep_quality), borderColor:'blue', fill:false},
                        {label:'Настроение', data:healthData.map(d=>d.mood), borderColor:'green', fill:false},
                        {label:'Здоровье', data:healthData.map(d=>d.health_status), borderColor:'purple', fill:false}
                    ]
                },
                options:{
                    scales:{ y:{ min:-2.5, max:2.5 } }
                }
            });
        }

        function drawActivity() {
            const ctx = activityChartRef.current.getContext('2d');
            if (window.actChart) window.actChart.destroy();
            window.actChart = new Chart(ctx, {
                type: 'bar',
                data: { labels:healthData.map(d=>d.date), datasets:[{label:'Активность', data:healthData.map(d=>d.physical_activity)}] },
                options:{ scales:{ y:{ min:0, max:4 } } }
            });
        }

        function drawNutrition() {
            const dates = healthData.map(d=>d.date);
            const normMin = Math.round(calorieNorm*0.85), normMax = Math.round(calorieNorm*1.15);
            const bars = healthData.map(d=>({ x:d.date, y:[d.calories_min, d.calories_max], veg:d.vegetables_percent }));
            const layout = { title:'Питание', xaxis:{title:'День'}, yaxis:{title:'Калории'} };
            const traces = [
                { x:dates, y:Array(dates.length).fill(normMax), type:'bar', base:Array(dates.length).fill(normMin), marker:{color:'rgba(200,200,200,0.4)'}, name:'Норма' }
            ];
            bars.forEach((b,i)=> traces.push({ x:[b.x], y:[b.y[1]-b.y[0]], base:[b.y[0]], type:'bar', marker:{color:b.veg>=50?'green':b.veg>=30?'yellow':'red'} }));
            Plotly.newPlot(nutritionRef.current, traces, layout, {displayModeBar:false});
        }

        // Мок-анализ текста
        function analyze() {
            if (!dayText.trim()) return;
            setIsAnalyzing(true);
            setTimeout(()=>{
                // Простая логика
                const analysis = { sleep_quality:0, mood:0, health_status:0, physical_activity:1, calories_min:calorieNorm-200, calories_max:calorieNorm+300, vegetables_percent:30, coffee_cups:1, alcohol_units:0, summary:'Анализ завершён', weekly_advice:'Продолжайте в том же духе' };
                const entry = { ...analysis, date:(new Date()).toISOString().split('T')[0] };
                setHealthData(d=>[...d, entry]);
                setSummary(analysis.summary); setAdvice(analysis.weekly_advice); setDayText(''); setIsAnalyzing(false);
            }, 1000);
        }

        return (<div className="max-w-4xl mx-auto p-4">
            <h1 className="text-2xl font-bold mb-4">🧠 AI Health Tracker</h1>
            <div className="mb-4 p-4 bg-white rounded shadow">
                <p>Профиль: {userProfile.name}, {userProfile.height} см, {userProfile.weight} кг</p>
                <p>Калорий норма: {calorieNorm} ккал/день</p>
            </div>
            {summary && (<div className="mb-4 p-4 bg-white rounded shadow">
                <h2 className="font-semibold">Сводка дня</h2><p>{summary}</p>
                <h2 className="font-semibold mt-2">Совет</h2><p>{advice}</p>
            </div>)}
            <div className="mb-4 p-4 bg-white rounded shadow">
                <textarea className="w-full p-2 border rounded" rows={4} value={dayText} onChange={e=>setDayText(e.target.value)} placeholder="Расскажите о вашем дне..."></textarea>
                <button onClick={analyze} disabled={isAnalyzing} className="mt-2 px-4 py-2 bg-blue-600 text-white rounded">
                    {isAnalyzing?'Анализирую...':'Анализировать'}
                </button>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
                <div className="bg-white p-4 rounded shadow">
                    <h3>Динамика самочувствия</h3>
                    <div className="chart-container"><canvas ref={healthChartRef}></canvas></div>
                </div>
                <div className="bg-white p-4 rounded shadow">
                    <h3>Физическая активность</h3>
                    <div className="chart-container"><canvas ref={activityChartRef}></canvas></div>
                </div>
            </div>
            <div className="bg-white p-4 rounded shadow mb-4">
                <h3>Питание и калории</h3>
                <div className="chart-container" ref={nutritionRef}></div>
            </div>
        </div>);
    }

    ReactDOM.render(<HealthTracker />, document.getElementById('root'));
    </script>
</body>
</html>
