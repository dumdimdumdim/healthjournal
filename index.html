<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Health Tracker</title>
  <!-- React 17 и ReactDOM 17 -->
  <script crossorigin src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
  <!-- Babel для JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- TailwindCSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Plotly.js -->
  <script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>
  <style>
    .chart-container { position: relative; height: 300px; width: 100%; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen p-4">
  <div id="root"></div>

  <script>
    // Генератор тестовых данных
    function randomBetween(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function getDateDaysAgo(daysAgo) {
      const date = new Date();
      date.setDate(date.getDate() - daysAgo);
      return date.toISOString().split('T')[0];
    }

    // Функции для преобразования цифр в слова
    function sleepToText(value) {
      const texts = {
        '-2': 'Ужасно',
        '-1': 'Плохо', 
        '0': 'Нормально',
        '1': 'Хорошо',
        '2': 'Отлично'
      };
      return texts[value.toString()] || 'Неизвестно';
    }

    function moodToText(value) {
      const texts = {
        '-2': 'Депрессия',
        '-1': 'Грустно',
        '0': 'Нейтрально', 
        '1': 'Хорошо',
        '2': 'Отлично'
      };
      return texts[value.toString()] || 'Неизвестно';
    }

    function healthToText(value) {
      const texts = {
        '-2': 'Очень плохо',
        '-1': 'Плохо',
        '0': 'Нормально',
        '1': 'Хорошо', 
        '2': 'Отлично'
      };
      return texts[value.toString()] || 'Неизвестно';
    }

    function activityToText(value) {
      const texts = {
        '0': 'Отдых',
        '1': 'Легкая',
        '2': 'Умеренная',
        '3': 'Интенсивная',
        '4': 'Максимальная'
      };
      return texts[value.toString()] || 'Неизвестно';
    }

    const dayDescriptions = [
      "хорошо выспался, позавтракал овсянкой с фруктами, пошел пешком на работу 2 км, выпил 2 кофе, на обед салат с курицей, вечером йога 30 минут, настроение отличное",
      "плохо спал всю ночь, болела голова, завтрак пропустил, выпил много кофе - 4 чашки, на обед только пельмени, после работы сразу домой, настроение паршивое",
      "проснулся бодрым, сделал зарядку, позавтракал яичницей с овощами, прошел пешком 3 км, выпил кофе утром, обедал борщом и салатом, вечером плавал в бассейне час, хорошее настроение",
      "спал нормально, завтрак - творог с ягодами, ехал на автобусе, 2 кофе за день, обед в кафе - паста с овощами, вечером встреча с друзьями, выпили пару бокалов вина, весело",
      "встал рано, чувствую себя отлично, завтрак дома - каша с фруктами, пробежка 5 км утром, один кофе, обед - рыба с овощами, вечером тренировка в зале, энергии полно",
      "поздно лег, плохо выспался, завтрак на бегу - бутерброд, много кофе - 3 чашки, обед - фастфуд, вечером лежал на диване, грустное настроение, голова болит",
      "выспался хорошо, утренняя прогулка с собакой 2 км, завтрак - омлет с зеленью, кофе с утра, обед дома - суп и салат, вечером читал книгу, спокойное настроение",
      "бессонная ночь, встал разбитым, пропустил завтрак, выпил кофе на ходу, обед - доставка пиццы, после работы сразу спать, ужасное самочувствие весь день",
      "отлично спал 8 часов, зарядка дома, завтрак - каша с орехами, велосипед до работы 4 км, кофе в офисе, обед - курица с овощами, вечером прогулка в парке, отличное настроение",
      "спал беспокойно, проснулся уставшим, завтрак легкий - йогурт, пешком немного, 2 кофе, обед простой - гречка с мясом, вечером фильм дома, настроение так себе",
      "выходной! спал до обеда, поздний завтрак - блины с вареньем, прогулка в центре города, кофе в кафе, ужин в ресторане с салатами, выпил бокал вина, расслабленное настроение",
      "рано встал, чувствую легкую простуду, завтрак не лез, горячий чай вместо кофе, обед легкий - суп, весь день дома, рано лег спать, болезненное состояние"
    ];

    function generateHealthEntry(daysAgo) {
      const originalText = dayDescriptions[randomBetween(0, dayDescriptions.length - 1)];
      const lowerText = originalText.toLowerCase();
      
      let sleep = 0;
      if (lowerText.includes('плохо спал') || lowerText.includes('бессонная') || lowerText.includes('беспокойно')) sleep = -1;
      if (lowerText.includes('хорошо спал') || lowerText.includes('отлично спал') || lowerText.includes('выспался')) sleep = 1;
      if (lowerText.includes('до обеда')) sleep = 2;
      
      let mood = 0;
      if (lowerText.includes('паршивое') || lowerText.includes('ужасное') || lowerText.includes('грустное')) mood = -1;
      if (lowerText.includes('отличное') || lowerText.includes('хорошее') || lowerText.includes('весело')) mood = 1;
      
      let health = 0;
      if (lowerText.includes('болела голова') || lowerText.includes('простуда') || lowerText.includes('болезненное')) health = -1;
      if (lowerText.includes('отлично') || lowerText.includes('энергии полно') || lowerText.includes('бодрым')) health = 1;
      
      let activity = 1;
      if (lowerText.includes('лежал') || (lowerText.includes('дома') && !lowerText.includes('зарядка'))) activity = 0;
      if (lowerText.includes('пробежка') || lowerText.includes('плавал') || lowerText.includes('велосипед')) activity = 2;
      if (lowerText.includes('тренировка') || lowerText.includes('йога') || lowerText.includes('зале')) activity = 3;
      
      let coffee = 1;
      if (lowerText.includes('много кофе') || lowerText.includes('4 кофе') || lowerText.includes('4 чашки')) coffee = 4;
      else if (lowerText.includes('3 кофе')) coffee = 3;
      else if (lowerText.includes('2 кофе')) coffee = 2;
      else if (lowerText.includes('чай') && !lowerText.includes('кофе')) coffee = 0;
      
      let alco = 0;
      if (lowerText.includes('вино') || lowerText.includes('бокал')) alco = randomBetween(1, 2);
      
      let vege = 30;
      if (lowerText.includes('салат') || lowerText.includes('овощ')) vege += 30;
      if (lowerText.includes('фрукт') || lowerText.includes('ягод')) vege += 20;
      if (lowerText.includes('фастфуд') || lowerText.includes('пицца')) vege -= 10;
      vege = Math.max(10, Math.min(100, vege));
      
      let baseCalories = 2000;
      if (lowerText.includes('пропустил завтрак') || lowerText.includes('легкий')) baseCalories -= 300;
      if (lowerText.includes('сытный') || lowerText.includes('ресторан')) baseCalories += 400;
      if (activity >= 2) baseCalories += 200;
      
      const calMin = baseCalories - randomBetween(200, 400);
      const calMax = baseCalories + randomBetween(200, 600);
      
      const sleepDesc = sleep === -1 ? 'плохо спал' : sleep === 1 ? 'хорошо спал' : 'обычный сон';
      const moodDesc = mood === -1 ? 'плохое настроение' : mood === 1 ? 'хорошее настроение' : 'нейтральное настроение';
      const activityDesc = ['отдыхал', 'легкая активность', 'умеренная активность', 'тренировки', 'интенсивные тренировки'][activity];
      const summary = sleepDesc + ', ' + moodDesc + ', ' + activityDesc;
      
      return {
        date: getDateDaysAgo(daysAgo),
        sleep: sleep, mood: mood, health: health, activity: activity,
        calMin: calMin, calMax: calMax, vege: vege, coffee: coffee, alco: alco,
        summary: summary, original: originalText
      };
    }

    function generateTestData(days) {
      const entries = [];
      for (let i = 1; i <= days; i++) {
        entries.push(generateHealthEntry(i));
      }
      return entries.sort(function(a, b) { 
        return new Date(b.date) - new Date(a.date); 
      });
    }
  </script>

  <script type="text/babel">
  const { useState, useEffect, useRef } = React;

  function HealthTracker() {
    const user = { weight: 75, height: 175, age: 28, name: 'Тестовый пользователь' };
    const bmr = 88.362 + 13.397 * user.weight + 4.799 * user.height - 5.677 * user.age;
    const calorieNorm = Math.round(bmr * 1.55);

    const [text, setText] = useState('');
    const [loading, setLoading] = useState(false);
    const [entries, setEntries] = useState([]);
    const [weeklySummary, setWeeklySummary] = useState('');
    const [weeklyAdvice, setWeeklyAdvice] = useState('');
    const [showTestDataButton, setShowTestDataButton] = useState(true);
    const [calorieGoal, setCalorieGoal] = useState('maintain'); // maintain, lose, gain

    const refHealth = useRef();
    const refActivity = useRef();
    const refCalories = useRef();

    useEffect(() => {
      const savedEntries = localStorage.getItem('healthEntries');
      if (savedEntries) {
        setEntries(JSON.parse(savedEntries));
        setShowTestDataButton(false);
      }
    }, []);

    useEffect(() => {
      if (entries.length > 0) {
        localStorage.setItem('healthEntries', JSON.stringify(entries));
        drawHealth();
        drawActivity();
        drawCalories();
        updateWeekly();
      }
    }, [entries, calorieGoal]); // Добавили calorieGoal в зависимости

    const loadTestData = () => {
      const testData = generateTestData(14);
      setEntries(testData);
      setShowTestDataButton(false);
      console.log('Загружено тестовых записей:', testData.length);
    };

    const clearAllData = () => {
      if (confirm('Удалить все данные?')) {
        setEntries([]);
        localStorage.removeItem('healthEntries');
        setShowTestDataButton(true);
        setWeeklySummary('');
        setWeeklyAdvice('');
      }
    };

    const addRandomEntry = async () => {
      const today = new Date().toISOString().split('T')[0];
      const existing = entries.find(e => e.date === today);
      
      if (existing && !confirm('Запись за сегодня уже есть. Заменить?')) {
        return;
      }
      
      const randomEntry = generateHealthEntry(0);
      setEntries(prev => {
        const filtered = prev.filter(e => e.date !== today);
        return [randomEntry, ...filtered].sort((a, b) => new Date(b.date) - new Date(a.date));
      });
    };

    async function analyzeWithProxy(dayText) {
      const res = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: dayText })
      });
      
      if (!res.ok) throw new Error('API Error: ' + res.status);
      return res.json();
    }

    const handleAnalyze = async () => {
      if (!text.trim()) {
        alert('Опишите день.');
        return;
      }
      
      setLoading(true);
      try {
        const today = new Date().toISOString().split('T')[0];
        const metrics = await analyzeWithProxy(text);
        
        setEntries(prev => {
          const filtered = prev.filter(e => e.date !== today);
          return [{ date: today, ...metrics }, ...filtered]
            .sort((a, b) => new Date(b.date) - new Date(a.date));
        });
        
        setText('');
      } catch(err) {
        console.error(err);
        alert('Ошибка анализа: ' + err.message);
      } finally {
        setLoading(false);
      }
    };

    function drawHealth() {
      const ctx = refHealth.current?.getContext('2d');
      if (!ctx || !entries.length) return;
      
      const sortedEntries = [...entries].sort((a, b) => new Date(a.date) - new Date(b.date));
      
      if (window.chartHealth) window.chartHealth.destroy();
      window.chartHealth = new Chart(ctx, {
        type: 'line',
        data: {
          labels: sortedEntries.map(e => e.date.slice(5).replace('-', '.')),
          datasets: [
            { label: 'Сон', data: sortedEntries.map(e => e.sleep), borderColor: '#3b82f6', fill: false, tension: 0.3 },
            { label: 'Настроение', data: sortedEntries.map(e => e.mood), borderColor: '#22c55e', fill: false, tension: 0.3 },
            { label: 'Здоровье', data: sortedEntries.map(e => e.health), borderColor: '#a855f7', fill: false, tension: 0.3 }
          ]
        },
        options: { 
          responsive: true, 
          maintainAspectRatio: false,
          scales: { 
            y: { 
              min: -2, 
              max: 2, 
              ticks: { 
                stepSize: 1,
                callback: function(value) {
                  const labels = {
                    '-2': 'Ужасно',
                    '-1': 'Плохо',
                    '0': 'Нормально', 
                    '1': 'Хорошо',
                    '2': 'Отлично'
                  };
                  return labels[value.toString()] || value;
                }
              }
            } 
          },
          plugins: {
            tooltip: {
              callbacks: {
                afterLabel: function(context) {
                  const entry = sortedEntries[context.dataIndex];
                  if (context.dataset.label === 'Сон') return 'Сон: ' + sleepToText(entry.sleep);
                  if (context.dataset.label === 'Настроение') return 'Настроение: ' + moodToText(entry.mood);
                  if (context.dataset.label === 'Здоровье') return 'Здоровье: ' + healthToText(entry.health);
                  return '';
                }
              }
            }
          }
        }
      });
    }

    function drawActivity() {
      const ctx = refActivity.current?.getContext('2d');
      if (!ctx || !entries.length) return;
      
      const sortedEntries = [...entries].sort((a, b) => new Date(a.date) - new Date(b.date));
      
      if (window.chartAct) window.chartAct.destroy();
      window.chartAct = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: sortedEntries.map(e => e.date.slice(5).replace('-', '.')),
          datasets: [{
            label: 'Активность',
            data: sortedEntries.map(e => e.activity),
            backgroundColor: sortedEntries.map(e =>
              e.activity === 0 ? '#9ca3af' :
              e.activity === 1 ? '#22c55e' :
              e.activity === 2 ? '#3b82f6' :
              e.activity === 3 ? '#f59e0b' : '#ef4444'
            )
          }]
        },
        options: { 
          responsive: true, 
          maintainAspectRatio: false,
          scales: { 
            y: { 
              min: 0, 
              max: 4, 
              ticks: { 
                stepSize: 1,
                callback: function(value) {
                  const labels = {
                    '0': 'Отдых',
                    '1': 'Легкая',
                    '2': 'Умеренная',
                    '3': 'Интенсивная',
                    '4': 'Максимальная'
                  };
                  return labels[value.toString()] || value;
                }
              }
            } 
          },
          plugins: {
            tooltip: {
              callbacks: {
                label: function(context) {
                  const entry = sortedEntries[context.dataIndex];
                  return 'Активность: ' + activityToText(entry.activity);
                }
              }
            }
          }
        }
      });
    }

    function drawCalories() {
      if (!refCalories.current || !entries.length) return;
      
      const sortedEntries = [...entries].sort((a, b) => new Date(a.date) - new Date(b.date));
      const dates = sortedEntries.map(e => e.date.slice(5).replace('-', '.'));
      const centers = sortedEntries.map(e => (e.calMin + e.calMax) / 2);
      const errUp = sortedEntries.map(e => e.calMax - (e.calMin + e.calMax) / 2);
      const errDn = sortedEntries.map(e => (e.calMin + e.calMax) / 2 - e.calMin);
      const colors = sortedEntries.map(e => e.vege >= 50 ? '#22c55e' : e.vege >= 30 ? '#f59e0b' : '#ef4444');
      
      // Вычисляем нормы калорий в зависимости от цели
      let targetCalories = calorieNorm;
      let goalText = '';
      let shapeColor = '';
      
      if (calorieGoal === 'lose') {
        targetCalories = Math.round(calorieNorm * 0.8); // -20% для похудения
        goalText = 'Снижение веса';
        shapeColor = 'rgba(59, 130, 246, 0.2)'; // синий
      } else if (calorieGoal === 'gain') {
        targetCalories = Math.round(calorieNorm * 1.2); // +20% для набора
        goalText = 'Набор массы';
        shapeColor = 'rgba(245, 158, 11, 0.2)'; // желтый
      } else {
        goalText = 'Поддержание веса';
        shapeColor = 'rgba(34, 197, 94, 0.2)'; // зеленый
      }
      
      const normMin = targetCalories * 0.9; // ±10% от целевого значения
      const normMax = targetCalories * 1.1;
      
      const shape = [{
        type: 'rect', xref: 'paper', yref: 'y',
        x0: 0, x1: 1, y0: normMin, y1: normMax,
        fillcolor: shapeColor, line: { width: 0 }
      }];

      const trace = {
        x: dates, y: centers, mode: 'markers',
        marker: { color: colors, size: 12 },
        error_y: { type: 'data', array: errUp, arrayminus: errDn, thickness: 2, width: 6 },
        customdata: sortedEntries.map(e => [e.vege, e.coffee, e.alco]),
        hovertemplate:
          '<b>%{x}</b><br>' +
          'Калории: %{y-error_y.arrayminus:.0f}–%{y+error_y.array:.0f} ккал<br>' +
          'Овощи: %{customdata[0]}%<br>' +
          '☕ %{customdata[1]}  🍺 %{customdata[2]}<extra></extra>'
      };

      const layout = {
        title: { 
          text: '🍎 Питание и калории<br><sub style="color: #666; font-size: 12px;">Цель: ' + goalText + ' (' + targetCalories + ' ккал/день)</sub>'
        },
        shapes: shape,
        xaxis: { title: 'День' },
        yaxis: { title: 'ккал' },
        margin: { t: 60, b: 60, l: 60, r: 20 },
        showlegend: false,
        annotations: [{
          x: 0.02,
          y: 0.98,
          xref: 'paper',
          yref: 'paper',
          text: '🎯 Целевая зона: ' + normMin.toFixed(0) + '-' + normMax.toFixed(0) + ' ккал',
          showarrow: false,
          font: { size: 11, color: '#666' },
          bgcolor: 'rgba(255,255,255,0.8)',
          bordercolor: '#ddd',
          borderwidth: 1
        }]
      };

      Plotly.react(refCalories.current, [trace], layout, { displayModeBar: false, responsive: true });
    }

    function updateWeekly() {
      const last7 = entries.slice(0, 7);
      if (last7.length < 1) return;
      const sum = last7.reduce((a, e) => {
        a.sleep += e.sleep; a.mood += e.mood; a.health += e.health;
        a.activity += e.activity; a.vege += e.vege;
        a.coffee += e.coffee; a.alco += e.alco;
        return a;
      }, { sleep: 0, mood: 0, health: 0, activity: 0, vege: 0, coffee: 0, alco: 0 });
      const n = last7.length;
      
      // Вычисляем средние значения
      const avgSleep = (sum.sleep / n);
      const avgMood = (sum.mood / n);
      const avgHealth = (sum.health / n);
      const avgActivity = (sum.activity / n);
      const avgVege = Math.round(sum.vege / n);
      const avgCoffee = (sum.coffee / n);
      const avgAlco = (sum.alco / n);
      
      // Сохраняем для дашборда
      setWeeklySummary({
        days: n,
        sleep: avgSleep,
        mood: avgMood,
        health: avgHealth,
        activity: avgActivity,
        vege: avgVege,
        coffee: avgCoffee,
        alco: avgAlco
      });
      
      let advice = '';
      if (avgSleep < -0.5) advice += 'Стоит улучшить качество сна. ';
      if (avgMood < 0) advice += 'Попробуйте больше активностей для настроения. ';
      if (avgActivity < 1.5) advice += 'Добавьте физической активности. ';
      if (avgVege < 40) advice += 'Включите больше овощей в рацион. ';
      if (avgCoffee > 3) advice += 'Возможно, стоит ограничить кофе. ';
      if (!advice) advice = 'Отличные показатели! Продолжайте в том же духе! 🎉';
      
      setWeeklyAdvice(advice);
    }

    // Функция для определения цвета метрики
    function getMetricColor(value, type) {
      if (type === 'sleep' || type === 'mood' || type === 'health') {
        if (value >= 1) return 'text-green-600 bg-green-50 border-green-200';
        if (value >= 0) return 'text-yellow-600 bg-yellow-50 border-yellow-200';
        return 'text-red-600 bg-red-50 border-red-200';
      }
      if (type === 'activity') {
        if (value >= 2.5) return 'text-green-600 bg-green-50 border-green-200';
        if (value >= 1.5) return 'text-yellow-600 bg-yellow-50 border-yellow-200';
        return 'text-red-600 bg-red-50 border-red-200';
      }
      if (type === 'vege') {
        if (value >= 50) return 'text-green-600 bg-green-50 border-green-200';
        if (value >= 30) return 'text-yellow-600 bg-yellow-50 border-yellow-200';
        return 'text-red-600 bg-red-50 border-red-200';
      }
      if (type === 'coffee') {
        if (value <= 2) return 'text-green-600 bg-green-50 border-green-200';
        if (value <= 3) return 'text-yellow-600 bg-yellow-50 border-yellow-200';
        return 'text-red-600 bg-red-50 border-red-200';
      }
      return 'text-gray-600 bg-gray-50 border-gray-200';
    }

    // Функция для получения текстового описания
    function getMetricText(value, type) {
      if (type === 'sleep') return sleepToText(Math.round(value));
      if (type === 'mood') return moodToText(Math.round(value));
      if (type === 'health') return healthToText(Math.round(value));
      if (type === 'activity') return activityToText(Math.round(value));
      return value.toString();
    }

    return (
      <div className="max-w-4xl mx-auto space-y-6">
        <header className="bg-white p-4 rounded shadow">
          <h1 className="text-2xl font-bold">🧠 AI Health Tracker</h1>
          <p className="text-gray-600">
            {user.name}, {user.height} см, {user.weight} кг — норма {calorieNorm} ккал/день
          </p>
          <p className="text-sm text-blue-600 mt-1">
            📊 Записей в системе: {entries.length}
          </p>
        </header>

        <section className="bg-gradient-to-r from-blue-50 to-purple-50 border border-blue-200 p-4 rounded-lg">
          <h3 className="font-semibold mb-3 text-blue-800">🎲 Управление данными</h3>
          <div className="flex flex-wrap gap-2">
            {showTestDataButton && (
              <button
                onClick={loadTestData}
                className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
              >
                📊 Загрузить тестовые данные (14 дней)
              </button>
            )}
            <button
              onClick={addRandomEntry}
              className="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700"
            >
              🎯 Добавить случайную запись за сегодня
            </button>
            <button
              onClick={clearAllData}
              className="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700"
            >
              🗑️ Очистить все данные
            </button>
          </div>
        </section>

        {weeklySummary && typeof weeklySummary === 'object' && (
          <section className="bg-white rounded-lg shadow-lg overflow-hidden">
            <div className="bg-gradient-to-r from-blue-600 to-purple-600 px-6 py-4">
              <h3 className="text-xl font-bold text-white flex items-center">
                📊 Сводка за {weeklySummary.days} дней
                <span className="ml-auto text-blue-100 text-sm">
                  {new Date().toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' })}
                </span>
              </h3>
            </div>
            
            <div className="p-6">
              {/* Основные метрики */}
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                {/* Сон */}
                <div className={`p-4 rounded-lg border-2 transition-all hover:shadow-md ${getMetricColor(weeklySummary.sleep, 'sleep')}`}>
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-2xl">😴</span>
                    <span className="text-xs font-medium opacity-75">СОН</span>
                  </div>
                  <div className="font-bold text-lg">{getMetricText(weeklySummary.sleep, 'sleep')}</div>
                  <div className="text-xs opacity-75 mt-1">{weeklySummary.sleep.toFixed(1)} балла</div>
                </div>

                {/* Настроение */}
                <div className={`p-4 rounded-lg border-2 transition-all hover:shadow-md ${getMetricColor(weeklySummary.mood, 'mood')}`}>
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-2xl">😊</span>
                    <span className="text-xs font-medium opacity-75">НАСТРОЕНИЕ</span>
                  </div>
                  <div className="font-bold text-lg">{getMetricText(weeklySummary.mood, 'mood')}</div>
                  <div className="text-xs opacity-75 mt-1">{weeklySummary.mood.toFixed(1)} балла</div>
                </div>

                {/* Здоровье */}
                <div className={`p-4 rounded-lg border-2 transition-all hover:shadow-md ${getMetricColor(weeklySummary.health, 'health')}`}>
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-2xl">❤️</span>
                    <span className="text-xs font-medium opacity-75">ЗДОРОВЬЕ</span>
                  </div>
                  <div className="font-bold text-lg">{getMetricText(weeklySummary.health, 'health')}</div>
                  <div className="text-xs opacity-75 mt-1">{weeklySummary.health.toFixed(1)} балла</div>
                </div>

                {/* Активность */}
                <div className={`p-4 rounded-lg border-2 transition-all hover:shadow-md ${getMetricColor(weeklySummary.activity, 'activity')}`}>
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-2xl">🏃</span>
                    <span className="text-xs font-medium opacity-75">АКТИВНОСТЬ</span>
                  </div>
                  <div className="font-bold text-lg">{getMetricText(weeklySummary.activity, 'activity')}</div>
                  <div className="text-xs opacity-75 mt-1">{weeklySummary.activity.toFixed(1)} балла</div>
                </div>
              </div>

              {/* Дополнительные метрики */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                {/* Овощи */}
                <div className={`p-4 rounded-lg border-2 transition-all hover:shadow-md ${getMetricColor(weeklySummary.vege, 'vege')}`}>
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xl">🥗</span>
                    <span className="text-xs font-medium opacity-75">ОВОЩИ В РАЦИОНЕ</span>
                  </div>
                  <div className="font-bold text-2xl">{weeklySummary.vege}%</div>
                  <div className="text-xs opacity-75 mt-1">
                    {weeklySummary.vege >= 50 ? 'Отлично!' : weeklySummary.vege >= 30 ? 'Неплохо' : 'Маловато'}
                  </div>
                </div>

                {/* Кофе */}
                <div className={`p-4 rounded-lg border-2 transition-all hover:shadow-md ${getMetricColor(weeklySummary.coffee, 'coffee')}`}>
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xl">☕</span>
                    <span className="text-xs font-medium opacity-75">КОФЕ В ДЕНЬ</span>
                  </div>
                  <div className="font-bold text-2xl">{weeklySummary.coffee.toFixed(1)}</div>
                  <div className="text-xs opacity-75 mt-1">
                    {weeklySummary.coffee <= 2 ? 'Норма' : weeklySummary.coffee <= 3 ? 'Много' : 'Слишком много!'}
                  </div>
                </div>

                {/* Алкоголь */}
                <div className="p-4 rounded-lg border-2 bg-gray-50 border-gray-200 text-gray-600 transition-all hover:shadow-md">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xl">🍺</span>
                    <span className="text-xs font-medium opacity-75">АЛКОГОЛЬ</span>
                  </div>
                  <div className="font-bold text-2xl">{weeklySummary.alco.toFixed(1)}</div>
                  <div className="text-xs opacity-75 mt-1">порций в день</div>
                </div>
              </div>

              {/* Рекомендации */}
              <div className="bg-gradient-to-r from-blue-50 to-indigo-50 p-4 rounded-lg border border-blue-200">
                <div className="flex items-start space-x-3">
                  <span className="text-2xl">💡</span>
                  <div>
                    <h4 className="font-semibold text-blue-900 mb-1">Персональные рекомендации</h4>
                    <p className="text-blue-800 text-sm leading-relaxed">{weeklyAdvice}</p>
                  </div>
                </div>
              </div>
            </div>
          </section>
        )}

        <section className="bg-white p-4 rounded shadow">
          <h3 className="font-semibold mb-2">✍️ Добавить новую запись</h3>
          <textarea
            className="w-full border p-2 rounded mb-2"
            rows={4}
            placeholder="Опишите свой день: как спали, что ели, какая была активность, настроение..."
            value={text}
            onChange={e => setText(e.target.value)}
            disabled={loading}
          />
          <button
            onClick={handleAnalyze}
            disabled={loading || !text.trim()}
            className="px-4 py-2 bg-blue-600 text-white rounded disabled:bg-gray-400"
          >
            {loading ? 'Анализирую…' : '🤖 Анализировать с помощью ИИ'}
          </button>
        </section>

        {entries.length > 0 && (
          <>
            <div className="grid lg:grid-cols-2 gap-6">
              <div className="bg-white p-4 rounded shadow">
                <h3 className="font-semibold mb-2">📈 Самочувствие по дням</h3>
                <div className="chart-container"><canvas ref={refHealth}></canvas></div>
              </div>
              <div className="bg-white p-4 rounded shadow">
                <h3 className="font-semibold mb-2">🏃 Уровень активности</h3>
                <div className="chart-container"><canvas ref={refActivity}></canvas></div>
              </div>
            </div>

            <div className="bg-white p-4 rounded shadow">
              <div className="flex justify-between items-center mb-4">
                <h3 className="font-semibold">🍎 Питание и калории</h3>
                <div className="flex gap-2">
                  <button
                    onClick={() => setCalorieGoal('maintain')}
                    className={`px-3 py-1 text-xs rounded-full transition-colors ${
                      calorieGoal === 'maintain' 
                        ? 'bg-green-500 text-white' 
                        : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                    }`}
                  >
                    🟢 Поддержание
                  </button>
                  <button
                    onClick={() => setCalorieGoal('lose')}
                    className={`px-3 py-1 text-xs rounded-full transition-colors ${
                      calorieGoal === 'lose' 
                        ? 'bg-blue-500 text-white' 
                        : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                    }`}
                  >
                    🔵 Снижение
                  </button>
                  <button
                    onClick={() => setCalorieGoal('gain')}
                    className={`px-3 py-1 text-xs rounded-full transition-colors ${
                      calorieGoal === 'gain' 
                        ? 'bg-yellow-500 text-white' 
                        : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                    }`}
                  >
                    🟡 Набор массы
                  </button>
                </div>
              </div>
              <div ref={refCalories} className="chart-container"></div>
              <div className="mt-3 text-sm text-gray-600">
                <div className="flex flex-wrap gap-4">
                  <span>🟢 Зеленый точки: &gt;50% овощей</span>
                  <span>🟡 Желтые точки: 30-50% овощей</span>
                  <span>🔴 Красные точки: &lt;30% овощей</span>
                </div>
              </div>
            </div>
          </>
        )}

        <section className="bg-white p-4 rounded shadow">
          <h3 className="font-semibold mb-3">📚 История записей</h3>
          {entries.length === 0 ? (
            <div className="text-center py-8">
              <p className="text-gray-500 italic text-lg">📝 Пока нет записей</p>
              <p className="text-gray-400 mt-2">Загрузите тестовые данные или добавьте первую запись!</p>
            </div>
          ) : (
            <div className="space-y-4">
              {entries.slice(0, 10).map((e, i) => (
                <div key={i} className="border p-4 rounded-lg hover:shadow-md transition-shadow">
                  <div className="flex justify-between items-center mb-2">
                    <span className="font-medium text-lg">
                      {new Date(e.date).toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' })}
                    </span>
                    <div className="flex space-x-1 text-xl">
                      {Array(Math.min(e.coffee || 0, 5)).fill().map((_, j) => <span key={j}>☕</span>)}
                      {Array(Math.min(e.alco || 0, 5)).fill().map((_, j) => <span key={j}>🍺</span>)}
                    </div>
                  </div>
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm mb-3">
                    <div className="flex items-center">
                      <span className="mr-2">😴</span>
                      <span>Сон: {sleepToText(e.sleep)}</span>
                    </div>
                    <div className="flex items-center">
                      <span className="mr-2">😊</span>
                      <span>Настроение: {moodToText(e.mood)}</span>
                    </div>
                    <div className="flex items-center">
                      <span className="mr-2">❤️</span>
                      <span>Здоровье: {healthToText(e.health)}</span>
                    </div>
                    <div className="flex items-center">
                      <span className="mr-2">{['💤','🚶','🏃','🏋️','🔥'][e.activity] || '❓'}</span>
                      <span>Активность: {activityToText(e.activity)}</span>
                    </div>
                  </div>
                  <div className="mb-2">
                    <span className="text-sm text-gray-500">🍽️ Калории: </span>
                    <span className="font-medium">{e.calMin}–{e.calMax} ккал</span>
                    <span className="text-sm text-gray-500 ml-4">🥗 Овощи: </span>
                    <span className={`font-medium ${e.vege >= 50 ? 'text-green-600' : e.vege >= 30 ? 'text-yellow-600' : 'text-red-600'}`}>
                      {e.vege}%
                    </span>
                  </div>
                  <p className="italic text-gray-600 bg-gray-50 p-2 rounded">"{e.summary}"</p>
                </div>
              ))}
            </div>
          )}
        </section>
      </div>
    );
  }

  ReactDOM.render(<HealthTracker />, document.getElementById('root'));
  </script>
</body>
</html>
