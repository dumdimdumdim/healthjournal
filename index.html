<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Health Tracker</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const HealthTracker = () => {
            // Профиль пользователя (тестовые данные)
            const userProfile = {
                weight: 98,
                height: 178,
                gender: 'male',
                age: 30,
                name: 'Пользователь'
            };

            // Рассчет нормы калорий (формула Харриса-Бенедикта)
            const calculateCalorieNorm = () => {
                const bmr = 88.362 + (13.397 * userProfile.weight) + (4.799 * userProfile.height) - (5.677 * userProfile.age);
                return Math.round(bmr * 1.55); // умеренная активность
            };

            const calorieNorm = calculateCalorieNorm();

            // Состояние приложения
            const [dayText, setDayText] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [healthData, setHealthData] = useState([]);
            const [currentSummary, setCurrentSummary] = useState('');
            const [weeklyAdvice, setWeeklyAdvice] = useState('');

            // Refs для графиков
            const healthChartRef = useRef(null);
            const activityChartRef = useRef(null);
            const nutritionChartRef = useRef(null);

            // Инициализация с тестовыми данными
            useEffect(() => {
                const mockData = generateMockData();
                setHealthData(mockData);
            }, []);

            // Генерация тестовых данных
            const generateMockData = () => {
                const data = [];
                const today = new Date();
                
                for (let i = 6; i >= 0; i--) {
                    const date = new Date(today);
                    date.setDate(date.getDate() - i);
                    
                    data.push({
                        date: date.toISOString().split('T')[0],
                        sleep_quality: Math.floor(Math.random() * 5) - 2,
                        mood: Math.floor(Math.random() * 5) - 2,
                        health_status: Math.floor(Math.random() * 5) - 2,
                        physical_activity: Math.floor(Math.random() * 5),
                        calories_min: calorieNorm - 200 + Math.random() * 400,
                        calories_max: calorieNorm + 200 + Math.random() * 400,
                        vegetables_percent: Math.random() * 100,
                        coffee_cups: Math.floor(Math.random() * 4),
                        alcohol_units: Math.random() < 0.3 ? Math.floor(Math.random() * 3) : 0,
                        summary: "Тестовый день " + (7-i),
                        original_text: ""
                    });
                }
                return data;
            };

            // Анализ текста через Claude
            const analyzeDay = async () => {
                if (!dayText.trim()) {
                    alert('Пожалуйста, расскажите о своем дне');
                    return;
                }

                setIsAnalyzing(true);

                try {
                    const prompt = `
                    Проанализируй рассказ о дне и верни данные в JSON формате.
                    
                    Рассказ: "${dayText}"
                    
                    Шкалы оценки:
                    - Качество сна, настроение, общее состояние: -2 (сильно хуже), -1 (хуже), 0 (как обычно), +1 (лучше), +2 (сильно лучше)
                    - Физическая нагрузка: 0 (не было), 1 (слабая), 2 (нормальная), 3 (сильная), 4 (экстремальная)
                    - Калории: нижняя и верхняя оценка потребления
                    - Овощи: процент от общего объема пищи
                    
                    Верни ТОЛЬКО чистый JSON без markdown форматирования:
                    {
                      "sleep_quality": число от -2 до +2,
                      "mood": число от -2 до +2,
                      "health_status": число от -2 до +2,
                      "physical_activity": число от 0 до 4,
                      "calories_min": число,
                      "calories_max": число,
                      "vegetables_percent": число от 0 до 100,
                      "coffee_cups": число чашек кофе,
                      "alcohol_units": число единиц алкоголя,
                      "summary": "краткое описание дня в одну строку",
                      "weekly_advice": "совет по образу жизни"
                    }
                    `;

                    const response = await window.claude.complete(prompt);
                    
                    // Убираем markdown форматирование если есть
                    let cleanResponse = response;
                    if (response.includes('```json')) {
                        cleanResponse = response.split('```json')[1].split('```')[0].trim();
                    } else if (response.includes('```')) {
                        cleanResponse = response.split('```')[1].trim();
                    }

                    const analysis = JSON.parse(cleanResponse);
                    
                    // Добавляем новую запись
                    const newEntry = {
                        ...analysis,
                        date: new Date().toISOString().split('T')[0],
                        original_text: dayText
                    };

                    setHealthData(prev => [...prev, newEntry]);
                    setCurrentSummary(analysis.summary);
                    setWeeklyAdvice(analysis.weekly_advice);
                    setDayText('');

                } catch (error) {
                    console.error('Ошибка анализа:', error);
                    alert('Ошибка анализа текста. Попробуйте еще раз.');
                } finally {
                    setIsAnalyzing(false);
                }
            };

            // Построение графиков
            useEffect(() => {
                if (healthData.length > 0) {
                    drawHealthChart();
                    drawActivityChart();
                    drawNutritionChart();
                }
            }, [healthData]);

            const drawHealthChart = () => {
                const ctx = healthChartRef.current?.getContext('2d');
                if (!ctx) return;

                // Уничтожаем предыдущий график
                if (window.healthChart) {
                    window.healthChart.destroy();
                }

                const labels = healthData.map(d => new Date(d.date).toLocaleDateString('ru-RU', {month: 'short', day: 'numeric'}));
                
                window.healthChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Сон',
                                data: healthData.map(d => d.sleep_quality),
                                borderColor: 'rgb(59, 130, 246)',
                                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                tension: 0.3
                            },
                            {
                                label: 'Настроение',
                                data: healthData.map(d => d.mood),
                                borderColor: 'rgb(34, 197, 94)',
                                backgroundColor: 'rgba(34, 197, 94, 0.1)',
                                tension: 0.3
                            },
                            {
                                label: 'Здоровье',
                                data: healthData.map(d => d.health_status),
                                borderColor: 'rgb(168, 85, 247)',
                                backgroundColor: 'rgba(168, 85, 247, 0.1)',
                                tension: 0.3
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: {
                                min: -2.5,
                                max: 2.5,
                                grid: {
                                    color: function(context) {
                                        if (context.tick.value === 0) {
                                            return 'rgba(0, 0, 0, 0.3)';
                                        }
                                        return 'rgba(0, 0, 0, 0.1)';
                                    }
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                position: 'top',
                            }
                        }
                    }
                });
            };

            const drawActivityChart = () => {
                const ctx = activityChartRef.current?.getContext('2d');
                if (!ctx) return;

                if (window.activityChart) {
                    window.activityChart.destroy();
                }

                const labels = healthData.map(d => new Date(d.date).toLocaleDateString('ru-RU', {month: 'short', day: 'numeric'}));
                
                window.activityChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Физическая активность',
                            data: healthData.map(d => d.physical_activity),
                            backgroundColor: healthData.map(d => {
                                if (d.physical_activity === 0) return 'rgba(156, 163, 175, 0.8)';
                                if (d.physical_activity <= 1) return 'rgba(34, 197, 94, 0.8)';
                                if (d.physical_activity <= 2) return 'rgba(59, 130, 246, 0.8)';
                                if (d.physical_activity <= 3) return 'rgba(245, 158, 11, 0.8)';
                                return 'rgba(239, 68, 68, 0.8)';
                            })
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: {
                                min: 0,
                                max: 4,
                                ticks: {
                                    stepSize: 1,
                                    callback: function(value) {
                                        const labels = ['Нет', 'Слабая', 'Нормальная', 'Сильная', 'Экстремальная'];
                                        return labels[value] || value;
                                    }
                                }
                            }
                        }
                    }
                });
            };

            const drawNutritionChart = () => {
                const ctx = nutritionChartRef.current?.getContext('2d');
                if (!ctx) return;

                if (window.nutritionChart) {
                    window.nutritionChart.destroy();
                }

                const labels = healthData.map(d => new Date(d.date).toLocaleDateString('ru-RU', {month: 'short', day: 'numeric'}));
                
                // Подготавливаем данные для свечного графика (используем bar chart с error bars эмуляцией)
                const nutritionData = healthData.map(d => ({
                    x: d.date,
                    y: (d.calories_min + d.calories_max) / 2,
                    min: d.calories_min,
                    max: d.calories_max,
                    vegetables: d.vegetables_percent
                }));

                window.nutritionChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Норма калорий',
                                data: Array(healthData.length).fill(calorieNorm),
                                type: 'line',
                                borderColor: 'rgba(156, 163, 175, 0.8)',
                                borderDash: [5, 5],
                                fill: false,
                                pointRadius: 0
                            },
                            {
                                label: 'Потребление калорий',
                                data: nutritionData.map(d => d.y),
                                backgroundColor: nutritionData.map(d => {
                                    if (d.vegetables >= 50) return 'rgba(34, 197, 94, 0.8)';
                                    if (d.vegetables >= 30) return 'rgba(245, 158, 11, 0.8)';
                                    return 'rgba(239, 68, 68, 0.8)';
                                })
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: {
                                min: Math.min(...nutritionData.map(d => d.min)) - 200,
                                max: Math.max(...nutritionData.map(d => d.max)) + 200
                            }
                        }
                    }
                });
            };

            const getActivityEmoji = (level) => {
                const emojis = ['💤', '🚶', '🏃', '🏋️', '🔥'];
                return emojis[level] || '❓';
            };

            return (
                <div className="min-h-screen bg-gray-50">
                    {/* Header */}
                    <header className="bg-white shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 py-6">
                            <div className="flex justify-between items-center">
                                <div>
                                    <h1 className="text-3xl font-bold text-gray-900">🧠 AI Health Tracker</h1>
                                    <p className="text-gray-600">Умный анализ вашего здоровья</p>
                                </div>
                                <div className="text-right">
                                    <p className="text-sm text-gray-500">Профиль: {userProfile.name}</p>
                                    <p className="text-sm text-gray-500">{userProfile.height}см, {userProfile.weight}кг</p>
                                    <p className="text-xs text-gray-400">Норма: {calorieNorm} ккал/день</p>
                                </div>
                            </div>
                        </div>
                    </header>

                    <div className="max-w-7xl mx-auto px-4 py-8">
                        {/* Сводка дня и совет */}
                        {(currentSummary || weeklyAdvice) && (
                            <div className="bg-white rounded-lg shadow-md p-6 mb-8">
                                {currentSummary && (
                                    <div className="mb-4">
                                        <h3 className="text-lg font-semibold text-gray-800 mb-2">📋 Сводка последнего дня:</h3>
                                        <p className="text-gray-700">{currentSummary}</p>
                                    </div>
                                )}
                                {weeklyAdvice && (
                                    <div>
                                        <h3 className="text-lg font-semibold text-gray-800 mb-2">💡 Рекомендации:</h3>
                                        <p className="text-blue-700 bg-blue-50 p-3 rounded-lg">{weeklyAdvice}</p>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Ввод данных о дне */}
                        <div className="bg-white rounded-lg shadow-md p-6 mb-8">
                            <h2 className="text-xl font-semibold mb-4">📝 Расскажите о своем дне</h2>
                            <textarea
                                value={dayText}
                                onChange={(e) => setDayText(e.target.value)}
                                placeholder="Как прошел ваш день? Расскажите о сне, настроении, еде, активности, самочувствии..."
                                className="w-full h-32 p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 resize-none"
                                disabled={isAnalyzing}
                            />
                            <div className="mt-4 flex justify-between items-center">
                                <p className="text-sm text-gray-500">
                                    ИИ проанализирует ваш рассказ и извлечет данные о здоровье
                                </p>
                                <button
                                    onClick={analyzeDay}
                                    disabled={isAnalyzing || !dayText.trim()}
                                    className="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors"
                                >
                                    {isAnalyzing ? '🔄 Анализирую...' : '🧠 Анализировать'}
                                </button>
                            </div>
                        </div>

                        {/* Графики */}
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                            {/* График самочувствия */}
                            <div className="bg-white rounded-lg shadow-md p-6">
                                <h3 className="text-lg font-semibold mb-4">📈 Динамика самочувствия</h3>
                                <div className="h-64">
                                    <canvas ref={healthChartRef}></canvas>
                                </div>
                                <p className="text-xs text-gray-500 mt-2">
                                    0 = норма, -2/-1 = хуже обычного, +1/+2 = лучше обычного
                                </p>
                            </div>

                            {/* График активности */}
                            <div className="bg-white rounded-lg shadow-md p-6">
                                <h3 className="text-lg font-semibold mb-4">🏃 Физическая активность</h3>
                                <div className="h-64">
                                    <canvas ref={activityChartRef}></canvas>
                                </div>
                            </div>
                        </div>

                        {/* График питания */}
                        <div className="bg-white rounded-lg shadow-md p-6 mb-8">
                            <h3 className="text-lg font-semibold mb-4">🍎 Питание и калории</h3>
                            <div className="h-64">
                                <canvas ref={nutritionChartRef}></canvas>
                            </div>
                            <div className="mt-4 flex justify-center space-x-6 text-sm">
                                <div className="flex items-center">
                                    <div className="w-4 h-4 bg-green-500 rounded mr-2"></div>
                                    <span>Много овощей (50%+)</span>
                                </div>
                                <div className="flex items-center">
                                    <div className="w-4 h-4 bg-yellow-500 rounded mr-2"></div>
                                    <span>Умеренно овощей (30-50%)</span>
                                </div>
                                <div className="flex items-center">
                                    <div className="w-4 h-4 bg-red-500 rounded mr-2"></div>
                                    <span>Мало овощей (&lt;30%)</span>
                                </div>
                            </div>
                        </div>

                        {/* История записей */}
                        <div className="bg-white rounded-lg shadow-md p-6">
                            <h3 className="text-lg font-semibold mb-4">📚 История записей</h3>
                            <div className="space-y-4">
                                {healthData.slice(-7).reverse().map((entry, index) => (
                                    <div key={index} className="border border-gray-200 rounded-lg p-4">
                                        <div className="flex justify-between items-start mb-2">
                                            <span className="font-medium">
                                                {new Date(entry.date).toLocaleDateString('ru-RU', {
                                                    weekday: 'long',
                                                    month: 'long',
                                                    day: 'numeric'
                                                })}
                                            </span>
                                            <div className="flex space-x-2 text-lg">
                                                {[...Array(entry.coffee_cups)].map((_, i) => (
                                                    <span key={i}>☕</span>
                                                ))}
                                                {[...Array(entry.alcohol_units)].map((_, i) => (
                                                    <span key={i}>🍺</span>
                                                ))}
                                            </div>
                                        </div>
                                        
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
                                            <div>
                                                <span className="text-gray-500">Сон:</span> 
                                                <span className={`ml-1 ${entry.sleep_quality >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                                    {entry.sleep_quality > 0 ? '+' : ''}{entry.sleep_quality}
                                                </span>
                                            </div>
                                            <div>
                                                <span className="text-gray-500">Настроение:</span>
                                                <span className={`ml-1 ${entry.mood >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                                    {entry.mood > 0 ? '+' : ''}{entry.mood}
                                                </span>
                                            </div>
                                            <div>
                                                <span className="text-gray-500">Активность:</span>
                                                <span className="ml-1">{getActivityEmoji(entry.physical_activity)}</span>
                                            </div>
                                            <div>
                                                <span className="text-gray-500">Калории:</span>
                                                <span className="ml-1">{Math.round(entry.calories_min)}-{Math.round(entry.calories_max)}</span>
                                            </div>
                                        </div>
                                        
                                        {entry.summary && (
                                            <p className="text-sm text-gray-600 mt-2 italic">"{entry.summary}"</p>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<HealthTracker />, document.getElementById('root'));
    </script>
</body>
</html>
