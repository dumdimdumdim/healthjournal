<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Diary App</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;

        const HealthDiary = () => {
            // Профиль пользователя
            const [userProfile, setUserProfile] = useState({
                height: 178,
                weight: 87,
                age: 30,
                gender: 'male'
            });

            // Функция для создания моковых данных
            const createMockData = () => {
                const mockEntries = [];
                const today = new Date();
                
                const mockTexts = [
                    "Спал отлично 8 часов. Завтрак - овсянка с ягодами и орехами, обед - куриная грудка с овощами.",
                    "Легкая головная боль утром. Выпил больше воды. Тренировка в зале 45 минут.",
                    "Отличное настроение! Прогулка в парке 30 минут. Ужин - рыба с салатом.",
                    "Небольшой стресс на работе. Медитация 15 минут помогла. Сон 7 часов.",
                    "Энергичный день! Пробежка утром 5км. Правильное питание весь день."
                ];

                for (let i = 4; i >= 0; i--) {
                    const date = new Date(today);
                    date.setDate(date.getDate() - i);
                    
                    mockEntries.push({
                        date: date.toISOString().split('T')[0],
                        mood: Math.floor(Math.random() * 5) + 1,
                        energy: Math.floor(Math.random() * 5) + 1,
                        sleep: Math.floor(Math.random() * 4) + 6,
                        exercise: Math.floor(Math.random() * 120),
                        weight: userProfile.weight + (Math.random() - 0.5) * 2,
                        notes: mockTexts[Math.floor(Math.random() * mockTexts.length)]
                    });
                }
                
                return mockEntries;
            };

            const [entries, setEntries] = useState(createMockData());
            const [currentEntry, setCurrentEntry] = useState({
                date: new Date().toISOString().split('T')[0],
                mood: 3,
                energy: 3,
                sleep: 7,
                exercise: 0,
                weight: userProfile.weight,
                notes: ''
            });

            const addEntry = () => {
                setEntries([...entries, currentEntry]);
                setCurrentEntry({
                    date: new Date().toISOString().split('T')[0],
                    mood: 3,
                    energy: 3,
                    sleep: 7,
                    exercise: 0,
                    weight: userProfile.weight,
                    notes: ''
                });
            };

            const StatCard = ({ title, value, unit, color }) => (
                <div className={`bg-white p-4 rounded-lg shadow-md border-l-4 ${color}`}>
                    <h3 className="text-sm font-medium text-gray-600">{title}</h3>
                    <p className="text-2xl font-bold text-gray-900">{value}{unit}</p>
                </div>
            );

            const MoodSelector = ({ value, onChange }) => {
                const moods = ['😢', '😕', '😐', '😊', '😍'];
                return (
                    <div className="flex space-x-2">
                        {moods.map((mood, index) => (
                            <button
                                key={index}
                                onClick={() => onChange(index + 1)}
                                className={`text-2xl p-2 rounded-full border-2 transition-all ${
                                    value === index + 1 
                                        ? 'border-blue-500 bg-blue-50' 
                                        : 'border-gray-200 hover:border-gray-300'
                                }`}
                            >
                                {mood}
                            </button>
                        ))}
                    </div>
                );
            };

            const averageMood = entries.length > 0 ? (entries.reduce((sum, entry) => sum + entry.mood, 0) / entries.length).toFixed(1) : 0;
            const averageEnergy = entries.length > 0 ? (entries.reduce((sum, entry) => sum + entry.energy, 0) / entries.length).toFixed(1) : 0;
            const averageSleep = entries.length > 0 ? (entries.reduce((sum, entry) => sum + entry.sleep, 0) / entries.length).toFixed(1) : 0;
            const latestWeight = entries.length > 0 ? entries[entries.length - 1].weight.toFixed(1) : userProfile.weight;

            return (
                <div className="min-h-screen bg-gray-50">
                    {/* Header */}
                    <header className="bg-white shadow-sm border-b">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between items-center py-4">
                                <h1 className="text-2xl font-bold text-gray-900">🏥 Health Diary</h1>
                                <div className="text-sm text-gray-500">
                                    Добро пожаловать! Ведите учет своего здоровья
                                </div>
                            </div>
                        </div>
                    </header>

                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {/* Статистика */}
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                            <StatCard title="Среднее настроение" value={averageMood} unit="/5" color="border-blue-500" />
                            <StatCard title="Средняя энергия" value={averageEnergy} unit="/5" color="border-green-500" />
                            <StatCard title="Средний сон" value={averageSleep} unit="ч" color="border-purple-500" />
                            <StatCard title="Текущий вес" value={latestWeight} unit="кг" color="border-orange-500" />
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            {/* Форма добавления записи */}
                            <div className="bg-white p-6 rounded-lg shadow-md">
                                <h2 className="text-xl font-semibold mb-6 text-gray-800">📝 Новая запись</h2>
                                
                                <div className="space-y-6">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">Дата</label>
                                        <input
                                            type="date"
                                            value={currentEntry.date}
                                            onChange={(e) => setCurrentEntry({...currentEntry, date: e.target.value})}
                                            className="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">
                                            Настроение ({currentEntry.mood}/5)
                                        </label>
                                        <MoodSelector 
                                            value={currentEntry.mood} 
                                            onChange={(value) => setCurrentEntry({...currentEntry, mood: value})}
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">
                                            Уровень энергии: {currentEntry.energy}/5
                                        </label>
                                        <input
                                            type="range"
                                            min="1"
                                            max="5"
                                            value={currentEntry.energy}
                                            onChange={(e) => setCurrentEntry({...currentEntry, energy: parseInt(e.target.value)})}
                                            className="w-full h-2 bg-green-200 rounded-lg slider"
                                        />
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">Сон (часы)</label>
                                            <input
                                                type="number"
                                                min="0"
                                                max="24"
                                                step="0.5"
                                                value={currentEntry.sleep}
                                                onChange={(e) => setCurrentEntry({...currentEntry, sleep: parseFloat(e.target.value)})}
                                                className="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">Упражнения (мин)</label>
                                            <input
                                                type="number"
                                                min="0"
                                                value={currentEntry.exercise}
                                                onChange={(e) => setCurrentEntry({...currentEntry, exercise: parseInt(e.target.value)})}
                                                className="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">Вес (кг)</label>
                                            <input
                                                type="number"
                                                step="0.1"
                                                value={currentEntry.weight}
                                                onChange={(e) => setCurrentEntry({...currentEntry, weight: parseFloat(e.target.value)})}
                                                className="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">Заметки</label>
                                        <textarea
                                            value={currentEntry.notes}
                                            onChange={(e) => setCurrentEntry({...currentEntry, notes: e.target.value})}
                                            placeholder="Как прошел день? Что ели? Как себя чувствовали?"
                                            className="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 h-24 resize-none"
                                        />
                                    </div>

                                    <button
                                        onClick={addEntry}
                                        className="w-full bg-blue-600 text-white py-3 px-4 rounded-md hover:bg-blue-700 transition-colors font-medium"
                                    >
                                        💾 Сохранить запись
                                    </button>
                                </div>
                            </div>

                            {/* История записей */}
                            <div className="bg-white p-6 rounded-lg shadow-md">
                                <h2 className="text-xl font-semibold mb-6 text-gray-800">📊 История записей</h2>
                                
                                <div className="space-y-4 max-h-96 overflow-y-auto">
                                    {entries.length === 0 ? (
                                        <p className="text-gray-500 text-center py-8">Записей пока нет</p>
                                    ) : (
                                        entries.map((entry, index) => (
                                            <div key={index} className="border border-gray-200 rounded-lg p-4 hover:bg-gray-50 transition-colors">
                                                <div className="flex justify-between items-start mb-2">
                                                    <span className="font-medium text-gray-900">
                                                        {new Date(entry.date).toLocaleDateString('ru-RU')}
                                                    </span>
                                                    <div className="flex items-center space-x-2">
                                                        <span className="text-sm text-gray-500">Настроение:</span>
                                                        <span className="text-lg">
                                                            {['😢', '😕', '😐', '😊', '😍'][entry.mood - 1]}
                                                        </span>
                                                    </div>
                                                </div>
                                                
                                                <div className="grid grid-cols-2 md:grid-cols-4 gap-2 text-sm text-gray-600 mb-2">
                                                    <span>💪 Энергия: {entry.energy}/5</span>
                                                    <span>😴 Сон: {entry.sleep}ч</span>
                                                    <span>🏃 Спорт: {entry.exercise}мин</span>
                                                    <span>⚖️ Вес: {entry.weight.toFixed(1)}кг</span>
                                                </div>
                                                
                                                {entry.notes && (
                                                    <p className="text-sm text-gray-700 bg-gray-50 p-2 rounded italic">
                                                        "{entry.notes}"
                                                    </p>
                                                )}
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<HealthDiary />, document.getElementById('root'));
    </script>
</body>
</html>
