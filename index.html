<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Health Tracker</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
        .chart-container canvas {
            max-height: 280px !important;
            max-width: 100% !important;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const HealthTracker = () => {
            const userProfile = {
                weight: 98,
                height: 178,
                gender: 'male',
                age: 30,
                name: 'Пользователь'
            };

            const calculateCalorieNorm = () => {
                const bmr = 88.362 + (13.397 * userProfile.weight) + (4.799 * userProfile.height) - (5.677 * userProfile.age);
                return Math.round(bmr * 1.55);
            };

            const calorieNorm = calculateCalorieNorm();

            const [dayText, setDayText] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [healthData, setHealthData] = useState([]);
            const [currentSummary, setCurrentSummary] = useState('');
            const [weeklyAdvice, setWeeklyAdvice] = useState('');

            const healthChartRef = useRef(null);
            const activityChartRef = useRef(null);
            const nutritionChartRef = useRef(null);

            useEffect(() => {
                const mockData = generateMockData();
                setHealthData(mockData);
            }, []);

            const generateMockData = () => {
                const data = [];
                const today = new Date();
                
                for (let i = 6; i >= 0; i--) {
                    const date = new Date(today);
                    date.setDate(date.getDate() - i);
                    
                    data.push({
                        date: date.toISOString().split('T')[0],
                        sleep_quality: Math.floor(Math.random() * 5) - 2,
                        mood: Math.floor(Math.random() * 5) - 2,
                        health_status: Math.floor(Math.random() * 5) - 2,
                        physical_activity: Math.floor(Math.random() * 5),
                        calories_min: calorieNorm - 300 + Math.random() * 200,
                        calories_max: calorieNorm + 200 + Math.random() * 400,
                        vegetables_percent: Math.random() * 100,
                        coffee_cups: Math.floor(Math.random() * 4),
                        alcohol_units: Math.random() < 0.3 ? Math.floor(Math.random() * 3) : 0,
                        summary: "Тестовый день " + (7-i),
                        original_text: ""
                    });
                }
                return data;
            };

            const analyzeDay = async () => {
                if (!dayText.trim()) {
                    alert('Пожалуйста, расскажите о своем дне');
                    return;
                }

                setIsAnalyzing(true);

                try {
                    let analysis;
                    
                    // Пробуем Claude API
                    if (window.claude && typeof window.claude.complete === 'function') {
                        try {
                            const prompt = `Анализ дня. Рассказ: "${dayText}". Верни ТОЛЬКО JSON:
{
  "sleep_quality": число от -2 до 2,
  "mood": число от -2 до 2,
  "health_status": число от -2 до 2,
  "physical_activity": число от 0 до 4,
  "calories_min": число,
  "calories_max": число,
  "vegetables_percent": число 0-100,
  "coffee_cups": число,
  "alcohol_units": число,
  "summary": "краткое описание",
  "weekly_advice": "совет"
}`;

                            const response = await window.claude.complete(prompt);
                            
                            let cleanResponse = response.trim();
                            if (cleanResponse.includes('```json')) {
                                cleanResponse = cleanResponse.split('```json')[1].split('```')[0].trim();
                            } else if (cleanResponse.includes('```')) {
                                cleanResponse = cleanResponse.split('```')[1].split('```')[0].trim();
                            }
                            const jsonMatch = cleanResponse.match(/\{[\s\S]*\}/);
                            if (jsonMatch) {
                                cleanResponse = jsonMatch[0];
                            }
                            
                            analysis = JSON.parse(cleanResponse);
                            console.log('Claude анализ успешен:', analysis);
                        } catch (claudeError) {
                            console.log('Claude ошибка, используем fallback:', claudeError);
                            analysis = createMockAnalysis(dayText);
                        }
                    } else {
                        console.log('Claude API недоступен, используем fallback');
                        analysis = createMockAnalysis(dayText);
                    }
                    
                    addAnalysisResult(analysis);

                } catch (error) {
                    console.error('Общая ошибка анализа:', error);
                    const mockAnalysis = createMockAnalysis(dayText);
                    addAnalysisResult(mockAnalysis);
                } finally {
                    setIsAnalyzing(false);
                }
            };

            const createMockAnalysis = (text) => {
                const textLower = text.toLowerCase();
                
                let sleep_quality = 0;
                if (textLower.includes('отлично') || textLower.includes('хорошо спал') || textLower.includes('8 часов')) sleep_quality = 1;
                if (textLower.includes('плохо спал') || textLower.includes('не спал') || textLower.includes('5 часов')) sleep_quality = -1;
                
                let mood = 0;
                if (textLower.includes('хорошее настроение') || textLower.includes('отлично') || textLower.includes('радостный')) mood = 1;
                if (textLower.includes('плохое настроение') || textLower.includes('грустный') || textLower.includes('усталый')) mood = -1;
                
                let physical_activity = 0;
                if (textLower.includes('тренировка') || textLower.includes('спортзал') || textLower.includes('бег')) physical_activity = 2;
                if (textLower.includes('интенсивная тренировка') || textLower.includes('тяжелая тренировка')) physical_activity = 3;
                if (textLower.includes('прогулка') || textLower.includes('легкая')) physical_activity = 1;
                
                let vegetables_percent = 30;
                if (textLower.includes('салат') || textLower.includes('овощи') || textLower.includes('брокколи')) vegetables_percent = 60;
                
                let coffee_cups = 0;
                if (textLower.includes('2 чашки кофе') || textLower.includes('две чашки')) coffee_cups = 2;
                else if (textLower.includes('кофе')) coffee_cups = 1;
                
                let alcohol_units = 0;
                if (textLower.includes('пиво') || textLower.includes('вино') || textLower.includes('алкоголь')) alcohol_units = 1;
                
                return {
                    sleep_quality,
                    mood,
                    health_status: Math.max(sleep_quality, mood),
                    physical_activity,
                    calories_min: calorieNorm - 200,
                    calories_max: calorieNorm + 300,
                    vegetables_percent,
                    coffee_cups,
                    alcohol_units,
                    summary: "Анализ на основе ключевых слов из вашего рассказа",
                    weekly_advice: "Продолжайте вести здоровый образ жизни, больше овощей и регулярные тренировки"
                };
            };

            const addAnalysisResult = (analysis) => {
                const validatedAnalysis = {
                    sleep_quality: Math.max(-2, Math.min(2, parseInt(analysis.sleep_quality) || 0)),
                    mood: Math.max(-2, Math.min(2, parseInt(analysis.mood) || 0)),
                    health_status: Math.max(-2, Math.min(2, parseInt(analysis.health_status) || 0)),
                    physical_activity: Math.max(0, Math.min(4, parseInt(analysis.physical_activity) || 0)),
                    calories_min: Math.max(800, parseInt(analysis.calories_min) || (calorieNorm - 200)),
                    calories_max: Math.max(parseInt(analysis.calories_min) + 100 || (calorieNorm - 100), parseInt(analysis.calories_max) || (calorieNorm + 300)),
                    vegetables_percent: Math.max(0, Math.min(100, parseInt(analysis.vegetables_percent) || 30)),
                    coffee_cups: Math.max(0, parseInt(analysis.coffee_cups) || 0),
                    alcohol_units: Math.max(0, parseInt(analysis.alcohol_units) || 0),
                    summary: analysis.summary || "Данные о дне",
                    weekly_advice: analysis.weekly_advice || "Следите за здоровьем"
                };

                const newEntry = {
                    ...validatedAnalysis,
                    date: new Date().toISOString().split('T')[0],
                    original_text: dayText
                };

                setHealthData(prev => [...prev, newEntry]);
                setCurrentSummary(validatedAnalysis.summary);
                setWeeklyAdvice(validatedAnalysis.weekly_advice);
                setDayText('');
                alert('✅ Анализ завершен успешно!');
            };

            useEffect(() => {
                if (healthData.length > 0) {
                    setTimeout(() => {
                        drawHealthChart();
                        drawActivityChart();
                        drawNutritionChart();
                    }, 100);
                }
            }, [healthData]);

            const drawHealthChart = () => {
                const ctx = healthChartRef.current?.getContext('2d');
                if (!ctx) return;

                if (window.healthChart) {
                    window.healthChart.destroy();
                }

                const labels = healthData.map(d => new Date(d.date).toLocaleDateString('ru-RU', {month: 'short', day: 'numeric'}));
                
                window.healthChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Сон',
                                data: healthData.map(d => d.sleep_quality),
                                borderColor: 'rgb(59, 130, 246)',
                                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                tension: 0.3,
                                pointRadius: 4
                            },
                            {
                                label: 'Настроение',
                                data: healthData.map(d => d.mood),
                                borderColor: 'rgb(34, 197, 94)',
                                backgroundColor: 'rgba(34, 197, 94, 0.1)',
                                tension: 0.3,
                                pointRadius: 4
                            },
                            {
                                label: 'Здоровье',
                                data: healthData.map(d => d.health_status),
                                borderColor: 'rgb(168, 85, 247)',
                                backgroundColor: 'rgba(168, 85, 247, 0.1)',
                                tension: 0.3,
                                pointRadius: 4
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                min: -2.5,
                                max: 2.5,
                                grid: {
                                    color: function(context) {
                                        return context.tick.value === 0 ? 'rgba(0, 0, 0, 0.3)' : 'rgba(0, 0, 0, 0.1)';
                                    }
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                position: 'top'
                            }
                        }
                    }
                });
            };

            const drawActivityChart = () => {
                const ctx = activityChartRef.current?.getContext('2d');
                if (!ctx) return;

                if (window.activityChart) {
                    window.activityChart.destroy();
                }

                const labels = healthData.map(d => new Date(d.date).toLocaleDateString('ru-RU', {month: 'short', day: 'numeric'}));
                
                window.activityChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Физическая активность',
                            data: healthData.map(d => d.physical_activity),
                            backgroundColor: healthData.map(d => {
                                if (d.physical_activity === 0) return 'rgba(156, 163, 175, 0.8)';
                                if (d.physical_activity <= 1) return 'rgba(34, 197, 94, 0.8)';
                                if (d.physical_activity <= 2) return 'rgba(59, 130, 246, 0.8)';
                                if (d.physical_activity <= 3) return 'rgba(245, 158, 11, 0.8)';
                                return 'rgba(239, 68, 68, 0.8)';
                            })
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                min: 0,
                                max: 4,
                                ticks: {
                                    stepSize: 1,
                                    callback: function(value) {
                                        const labels = ['Нет', 'Слабая', 'Нормальная', 'Сильная', 'Экстремальная'];
                                        return labels[value] || value;
                                    }
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: false
                            }
                        }
                    }
                });
            };

            const drawNutritionChart = () => {
                const ctx = nutritionChartRef.current?.getContext('2d');
                if (!ctx) return;

                if (window.nutritionChart) {
                    window.nutritionChart.destroy();
                }

                const labels = healthData.map(d => new Date(d.date).toLocaleDateString('ru-RU', {month: 'short', day: 'numeric'}));
                
                // Зона нормы ±15%
                const normMin = Math.round(calorieNorm * 0.85); // 2720
                const normMax = Math.round(calorieNorm * 1.15); // 3680
                
                // Цвета по овощам
                const getColor = (vegetables) => {
                    if (vegetables >= 50) return { bg: 'rgba(34, 197, 94, 0.8)', border: 'rgb(34, 197, 94)' };
                    if (vegetables >= 30) return { bg: 'rgba(245, 158, 11, 0.8)', border: 'rgb(245, 158, 11)' };
                    return { bg: 'rgba(239, 68, 68, 0.8)', border: 'rgb(239, 68, 68)' };
                };

                window.nutritionChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [
                            // 1. Зона нормы (серый фон)
                            {
                                label: 'Зона нормы',
                                data: Array(healthData.length).fill(normMax),
                                backgroundColor: 'rgba(229, 231, 235, 0.6)',
                                borderColor: 'rgba(156, 163, 175, 0.8)',
                                borderWidth: 1,
                                barThickness: 70,
                                order: 3
                            },
                            // 2. Вырез зоны нормы снизу
                            {
                                label: 'Вырез нормы',
                                data: Array(healthData.length).fill(normMin),
                                backgroundColor: 'rgba(255, 255, 255, 1)',
                                borderColor: 'rgba(156, 163, 175, 0.8)',
                                borderWidth: 1,
                                barThickness: 70,
                                order: 4
                            },
                            // 3. Пунктирная линия нормы
                            {
                                label: 'Норма калорий',
                                data: Array(healthData.length).fill(calorieNorm),
                                type: 'line',
                                borderColor: '#9ca3af',
                                borderDash: [5, 5],
                                borderWidth: 2,
                                fill: false,
                                pointRadius: 0,
                                order: 0
                            },
                            // 4. Свечи калорий
                            {
                                label: 'Диапазон калорий',
                                data: healthData.map(d => {
                                    return (d.calories_min > 0 || d.calories_max > 0) ? d.calories_max : null;
                                }),
                                backgroundColor: healthData.map(d => {
                                    if (d.calories_min === 0 && d.calories_max === 0) return 'transparent';
                                    return getColor(d.vegetables_percent).bg;
                                }),
                                borderColor: healthData.map(d => {
                                    if (d.calories_min === 0 && d.calories_max === 0) return 'transparent';
                                    return getColor(d.vegetables_percent).border;
                                }),
                                borderWidth: 2,
                                barThickness: 30,
                                order: 1
                            },
                            // 5. Вырез свечей снизу (до min)
                            {
                                label: 'Вырез свечей',
                                data: healthData.map(d => {
                                    return (d.calories_min > 0 || d.calories_max > 0) ? d.calories_min : null;
                                }),
                                backgroundColor: healthData.map(d => {
                                    if (d.calories_min === 0 && d.calories_max === 0) return 'transparent';
                                    return 'rgba(255, 255, 255, 1)';
                                }),
                                borderColor: healthData.map(d => {
                                    if (d.calories_min === 0 && d.calories_max === 0) return 'transparent';
                                    return getColor(d.vegetables_percent).border;
                                }),
                                borderWidth: 2,
                                barThickness: 30,
                                order: 2
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: {
                                stacked: false,
                                title: {
                                    display: true,
                                    text: 'Дни'
                                }
                            },
                            y: {
                                stacked: true,
                                min: 0,
                                max: 5000,
                                title: {
                                    display: true,
                                    text: 'Калории (ккал)'
                                },
                                ticks: {
                                    stepSize: 500,
                                    callback: function(value) {
                                        return value.toLocaleString() + ' ккал';
                                    }
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                position: 'top',
                                labels: {
                                    filter: function(legendItem) {
                                        return ['Норма калорий', 'Диапазон калорий'].includes(legendItem.text);
                                    },
                                    usePointStyle: true,
                                    padding: 20
                                }
                            },
                            tooltip: {
                                filter: function(tooltipItem) {
                                    return [2, 3].includes(tooltipItem.datasetIndex);
                                },
                                callbacks: {
                                    title: function(context) {
                                        const date = healthData[context[0].dataIndex].date;
                                        return new Date(date).toLocaleDateString('ru-RU', {
                                            weekday: 'long',
                                            day: 'numeric',
                                            month: 'long'
                                        });
                                    },
                                    label: function(context) {
                                        const entry = healthData[context.dataIndex];
                                        
                                        if (context.datasetIndex === 2) {
                                            return `📊 Рекомендуемый интервал: ${normMin}-${normMax} ккал`;
                                        }
                                        
                                        if (context.datasetIndex === 3) {
                                            if (entry.calories_min === 0 && entry.calories_max === 0) {
                                                return '🚫 Нет данных о питании';
                                            }
                                            return `🍽️ Потребление: ${Math.round(entry.calories_min)}-${Math.round(entry.calories_max)} ккал`;
                                        }
                                        
                                        return '';
                                    },
                                    afterLabel: function(context) {
                                        if (context.datasetIndex === 3) {
                                            const entry = healthData[context.dataIndex];
                                            if (entry.calories_min === 0 && entry.calories_max === 0) return [];
                                            
                                            const info = [];
                                            if (entry.vegetables_percent >= 50) {
                                                info.push(`🥬 Много овощей (${Math.round(entry.vegetables_percent)}%)`);
                                            } else if (entry.vegetables_percent >= 30) {
                                                info.push(`🥕 Умеренно овощей (${Math.round(entry.vegetables_percent)}%)`);
                                            } else if (entry.vegetables_percent > 0) {
                                                info.push(`🍅 Мало овощей (${Math.round(entry.vegetables_percent)}%)`);
                                            }
                                            
                                            if (entry.coffee_cups > 0) info.push(`☕ ${entry.coffee_cups} чашек кофе`);
                                            if (entry.alcohol_units > 0) info.push(`🍺 ${entry.alcohol_units} ед. алкоголя`);
                                            
                                            return info;
                                        }
                                        return [];
                                    }
                                }
                            }
                        }
                    }
                });
            };

            const getActivityEmoji = (level) => {
                const emojis = ['💤', '🚶', '🏃', '🏋️', '🔥'];
                return emojis[level] || '❓';
            };

            return (
                <div className="min-h-screen bg-gray-50">
                    {/* Header */}
                    <header className="bg-white shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 py-4">
                            <div className="flex justify-between items-center">
                                <div>
                                    <h1 className="text-2xl font-bold text-gray-900">🧠 AI Health Tracker</h1>
                                    <p className="text-sm text-gray-600">Умный анализ вашего здоровья</p>
                                </div>
                                <div className="text-right text-sm">
                                    <p className="text-gray-500">Профиль: {userProfile.name}</p>
                                    <p className="text-gray-500">{userProfile.height}см, {userProfile.weight}кг</p>
                                    <p className="text-xs text-gray-400">Норма: {calorieNorm} ккал/день</p>
                                </div>
                            </div>
                        </div>
                    </header>

                    <div className="max-w-7xl mx-auto px-4 py-6">
                        {/* Сводка дня и совет */}
                        {(currentSummary || weeklyAdvice) && (
                            <div className="bg-white rounded-lg shadow p-4 mb-6">
                                {currentSummary && (
                                    <div className="mb-3">
                                        <h3 className="text-lg font-semibold text-gray-800 mb-2">📋 Сводка последнего дня:</h3>
                                        <p className="text-gray-700 text-sm">{currentSummary}</p>
                                    </div>
                                )}
                                {weeklyAdvice && (
                                    <div>
                                        <h3 className="text-lg font-semibold text-gray-800 mb-2">💡 Рекомендации:</h3>
                                        <p className="text-blue-700 bg-blue-50 p-3 rounded text-sm">{weeklyAdvice}</p>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Ввод данных о дне */}
                        <div className="bg-white rounded-lg shadow p-4 mb-6">
                            <h2 className="text-lg font-semibold mb-3">📝 Расскажите о своем дне</h2>
                            <textarea
                                value={dayText}
                                onChange={(e) => setDayText(e.target.value)}
                                placeholder="Как прошел ваш день? Расскажите о сне, настроении, еде, активности, самочувствии..."
                                className="w-full h-24 p-3 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500 resize-none text-sm"
                                disabled={isAnalyzing}
                            />
                            <div className="mt-3 flex justify-between items-center">
                                <p className="text-xs text-gray-500">
                                    ИИ проанализирует ваш рассказ и извлечет данные о здоровье
                                </p>
                                <button
                                    onClick={analyzeDay}
                                    disabled={isAnalyzing || !dayText.trim()}
                                    className="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors text-sm"
                                >
                                    {isAnalyzing ? '🔄 Анализирую...' : '🧠 Анализировать'}
                                </button>
                            </div>
                        </div>

                        {/* Графики */}
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                            {/* График самочувствия */}
                            <div className="bg-white rounded-lg shadow p-4">
                                <h3 className="text-lg font-semibold mb-3">📈 Динамика самочувствия</h3>
                                <div className="chart-container">
                                    <canvas ref={healthChartRef}></canvas>
                                </div>
                                <p className="text-xs text-gray-500 mt-2">
                                    0 = норма, -2/-1 = хуже обычного, +1/+2 = лучше обычного
                                </p>
                            </div>

                            {/* График активности */}
                            <div className="bg-white rounded-lg shadow p-4">
                                <h3 className="text-lg font-semibold mb-3">🏃 Физическая активность</h3>
                                <div className="chart-container">
                                    <canvas ref={activityChartRef}></canvas>
                                </div>
                            </div>
                        </div>

                        {/* График питания */}
                        <div className="bg-white rounded-lg shadow p-4 mb-6">
                            <h3 className="text-lg font-semibold mb-3">🍎 Питание и калории (свечи)</h3>
                            <div className="chart-container">
                                <canvas ref={nutritionChartRef}></canvas>
                            </div>
                            <div className="mt-3 flex justify-center space-x-6 text-xs">
                                <div className="flex items-center">
                                    <div className="w-3 h-3 bg-green-500 rounded mr-2"></div>
                                    <span>Много овощей (50%+)</span>
                                </div>
                                <div className="flex items-center">
                                    <div className="w-3 h-3 bg-yellow-500 rounded mr-2"></div>
                                    <span>Умеренно овощей (30-50%)</span>
                                </div>
                                <div className="flex items-center">
                                    <div className="w-3 h-3 bg-red-500 rounded mr-2"></div>
                                    <span>Мало овощей (&lt;30%)</span>
                                </div>
                            </div>
                        </div>

                        {/* История записей */}
                        <div className="bg-white rounded-lg shadow p-4">
                            <h3 className="text-lg font-semibold mb-3">📚 История записей</h3>
                            <div className="space-y-3">
                                {healthData.slice(-7).reverse().map((entry, index) => (
                                    <div key={index} className="border border-gray-200 rounded p-3">
                                        <div className="flex justify-between items-start mb-2">
                                            <span className="font-medium text-sm">
                                                {new Date(entry.date).toLocaleDateString('ru-RU', {
                                                    weekday: 'long',
                                                    month: 'long',
                                                    day: 'numeric'
                                                })}
                                            </span>
                                            <div className="flex space-x-1 text-sm">
                                                {[...Array(entry.coffee_cups)].map((_, i) => (
                                                    <span key={i}>☕</span>
                                                ))}
                                                {[...Array(entry.alcohol_units)].map((_, i) => (
                                                    <span key={i}>🍺</span>
                                                ))}
                                            </div>
                                        </div>
                                        
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-2 text-xs">
                                            <div>
                                                <span className="text-gray-500">Сон:</span> 
                                                <span className={`ml-1 ${entry.sleep_quality >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                                    {entry.sleep_quality > 0 ? '+' : ''}{entry.sleep_quality}
                                                </span>
                                            </div>
                                            <div>
                                                <span className="text-gray-500">Настроение:</span>
                                                <span className={`ml-1 ${entry.mood >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                                    {entry.mood > 0 ? '+' : ''}{entry.mood}
                                                </span>
                                            </div>
                                            <div>
                                                <span className="text-gray-500">Активность:</span>
                                                <span className="ml-1">{getActivityEmoji(entry.physical_activity)}</span>
                                            </div>
                                            <div>
                                                <span className="text-gray-500">Калории:</span>
                                                <span className="ml-1">{Math.round(entry.calories_min)}-{Math.round(entry.calories_max)}</span>
                                            </div>
                                        </div>
                                        
                                        {entry.summary && (
                                            <p className="text-sm text-gray-600 mt-2 italic">"{entry.summary}"</p>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<HealthTracker />, document.getElementById('root'));
    </script>
</body>
</html>
